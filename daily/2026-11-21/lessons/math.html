<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>週末複習：公園小商店</title>
<!--
  教學老師的教材範本（每天複製這個檔案到 daily/日期/lessons/科目.html 再改內容）
  規則：
  - 一個檔案就是一個完整教材，CSS、JS、圖都寫在裡面，不能載入任何外部網址。
  - 每一個 <section class="step"> 是一頁，下方會自動出現「上一步／下一步」和進度點。
  - data-auto="要念的話"：進到這一頁時自動朗讀（data-lang="en-US" 用英文念）。
  - 任何元素加上 data-say="要念的話"（可加 data-lang="en-US"），點了就會念。
  - 小測驗：<div class="quiz" data-why="答對時的補充說明"> 裡面放按鈕，正確的按鈕加 data-right，後面放 <div class="fb"></div>。
  - 需要每頁自己的動畫：寫 window.onStep = function (index, section) { … }，換頁時會呼叫。
  - 只改「教材內容」區塊和自訂樣式；下面的共用程式不要改壞。
-->
<style>
:root { --c: #2f8fd8; --ink: #2b2112; --bg: #fffaf0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
.prog { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.prog i { width: 14px; height: 14px; border-radius: 50%; background: #e0d6c3; }
.prog i.on { background: var(--c); }
.step { display: none; }
.step.on { display: block; animation: stepIn .45s ease-out; }
@keyframes stepIn { from { opacity: 0; transform: translateY(18px); } }
h1 { margin: 6px 0 10px; font-size: clamp(26px, 6.5vw, 38px); text-align: center; color: var(--c); }
.big { font-size: clamp(21px, 5.4vw, 29px); font-weight: 900; line-height: 1.55; text-align: center; margin: 8px 0; }
.small { font-size: 17px; font-weight: 700; text-align: center; color: #6a5536; }
.stage { position: relative; min-height: 240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; padding: 16px; border-radius: 24px; background: #fff; box-shadow: 0 5px 0 #eadfc8; overflow: hidden; }
.say { display: inline-flex; align-items: center; gap: 6px; margin: 6px; padding: 10px 18px; border: 0; border-radius: 999px; background: #e3f2fd; box-shadow: 0 3px 0 #90caf9; font: inherit; font-size: 18px; font-weight: 900; color: #0d47a1; cursor: pointer; }
.say:active { transform: translateY(2px); }
.center { text-align: center; }
.card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; padding: 12px 14px; border: 0; border-radius: 20px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; cursor: pointer; }
.card:active { transform: translateY(3px); }
.quiz { display: grid; gap: 10px; margin-top: 12px; }
.quiz button { min-height: 60px; padding: 8px 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 #d6c39a; font: inherit; font-size: clamp(19px, 5vw, 24px); font-weight: 900; color: var(--ink); cursor: pointer; }
.quiz button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.quiz button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.fb { min-height: 1.6em; margin-top: 10px; text-align: center; font-size: 20px; font-weight: 900; color: #0e6b2e; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,250,240,.96); box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
.nav button { flex: 1; min-height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
#prev { background: #fff; box-shadow: 0 4px 0 #d7c3ad; color: var(--ink); }
#next { background: linear-gradient(180deg, #ffe38a, #ffc93c 55%, #e09a12); box-shadow: 0 4px 0 #9a6608; color: #3a2208; }
.nav button:disabled { opacity: .4; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
/* ===== 自訂樣式（這一份教材自己的動畫）寫在這裡 ===== */
.shop { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.shop button { min-height: 104px; border: 0; border-radius: 18px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: drop .45s ease-out both; }
.shop button .e { font-size: 40px; }
.shop button .p { font-size: 20px; font-weight: 900; color: #b24a0e; }
.shop button .n { font-size: 15px; font-weight: 800; color: #6a5536; }
.shop button.on { background: #2f8fd8; box-shadow: 0 4px 0 #1d5f99; }
.shop button.on .p, .shop button.on .n { color: #fff; }
@keyframes drop { from { transform: translateY(-40px) scale(.6); opacity: 0; } }
.vert { display: inline-grid; grid-template-columns: 44px 52px 52px; font-size: 46px; font-weight: 900; line-height: 1.25; text-align: center; font-family: system-ui, sans-serif; }
.vert .c { font-size: 22px; color: #e5484d; height: 30px; line-height: 30px; }
.vert .ln { grid-column: 1 / 4; border-top: 5px solid #2b2112; margin: 4px 0; }
.vert .hl { background: #fff3a8; border-radius: 10px; }
.vert .r { color: #e5484d; animation: pop .4s ease-out; }
.vert .x { position: relative; color: #9b9b9b; }
.vert .x::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; border-top: 4px solid #e5484d; transform: rotate(-20deg); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.say2 { width: 100%; min-height: 3.2em; text-align: center; font-size: 20px; font-weight: 900; color: #1d5f99; line-height: 1.6; }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; width: 100%; }
.btns button { min-height: 56px; padding: 6px 18px; border: 0; border-radius: 999px; background: #e3f0fb; box-shadow: 0 3px 0 #8fc0ea; font: inherit; font-size: 20px; font-weight: 900; color: #1d5f99; cursor: pointer; }
.btns button.on { background: #2f8fd8; color: #fff; }
.cmp { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; font-size: clamp(30px, 8vw, 44px); font-weight: 900; }
.cmp .box { min-width: 70px; min-height: 70px; border-radius: 16px; border: 4px dashed #2f8fd8; display: flex; align-items: center; justify-content: center; color: #e5484d; }
.sym { display: flex; gap: 12px; justify-content: center; width: 100%; }
.sym button { width: 84px; height: 72px; border: 0; border-radius: 18px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; font-size: 38px; font-weight: 900; cursor: pointer; }
.sym button.no { background: #ffe1e1; animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.score { font-size: 28px; letter-spacing: 4px; min-height: 1.3em; }
.msg { width: 100%; min-height: 2.4em; font-size: 20px; font-weight: 900; text-align: center; color: #0e6b2e; line-height: 1.5; }
.pots { display: grid; grid-template-columns: repeat(5, 40px); gap: 4px; justify-content: center; }
.pot { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 28px; border-radius: 10px; animation: drop .35s ease-out both; }
.pot.done { background: #fde3ef; }
.pot.left { background: #e3f0fb; box-shadow: 0 0 0 2px #2f8fd8 inset; }
.eqn { width: 100%; text-align: center; font-size: clamp(26px, 7vw, 38px); font-weight: 900; color: #2f8fd8; min-height: 1.3em; line-height: 1.5; }
.eqn .r { color: #e5484d; }
.qbox { margin: 12px 0 18px; padding: 12px; border-radius: 20px; background: #fff; box-shadow: 0 4px 0 #eadfc8; }
.qbox .big { margin-top: 0; }
</style>
</head>
<body>
<main class="wrap">
  <div class="prog"></div>

  <!-- ===== 教材內容 ===== -->
  <section class="step" data-auto="歡迎來到公園小商店！買東西的時候，要用到加法、減法和乘法。今天我們一起複習這個星期學過的數學。">
    <h1>🏪 公園小商店</h1>
    <div class="stage">
      <div class="shop" id="introShop"></div>
      <div class="eqn" id="introE"></div>
    </div>
    <p class="big">買東西要會 <b style="color:#2f8fd8">＋ － ×</b>！</p>
    <p class="center"><button class="say" id="introAgain">🔄 再看一次</button></p>
  </section>

  <section class="step" data-auto="選兩樣東西，算算看一起要多少元。個位加起來滿十，就要進一到十位。">
    <h1>➕ 進位加法：一起買多少錢？</h1>
    <p class="small">點兩樣東西，再按「下一步」看直式</p>
    <div class="stage">
      <div class="shop" id="addShop"></div>
      <div class="vert" id="addV"></div>
      <div class="say2" id="addT">先選兩樣東西</div>
      <div class="btns"><button id="addStep">▶ 下一步</button></div>
    </div>
  </section>

  <section class="step" data-auto="帶了錢去買東西，還剩多少元？個位不夠減，就要向十位借一，變成十幾再減。">
    <h1>➖ 退位減法：還剩多少錢？</h1>
    <p class="small">先選帶多少錢，再選要買的東西</p>
    <div class="btns" id="wallet"></div>
    <div class="stage">
      <div class="shop" id="subShop"></div>
      <div class="vert" id="subV"></div>
      <div class="say2" id="subT">選一樣東西</div>
      <div class="btns"><button id="subStep">▶ 下一步</button></div>
    </div>
  </section>

  <section class="step" data-auto="乘法比大小！先用口訣算出兩邊的答案，再比一比哪邊大。">
    <h1>⚖️ 乘法比大小</h1>
    <div class="stage">
      <div class="cmp"><span id="cL"></span><span class="box" id="cB">？</span><span id="cR"></span></div>
      <div class="sym" id="sym"><button>&gt;</button><button>&lt;</button><button>=</button></div>
      <div class="score" id="cScore"></div>
      <div class="msg" id="cMsg"></div>
    </div>
    <p class="center"><button class="say" id="cAgain">🔄 再玩一次</button></p>
  </section>

  <section class="step" data-auto="公園有八排花盆，每排五盆。有二十三盆開花了，還沒開花的有幾盆？要先乘，再減。按按鈕一步一步算。">
    <h1>🌷 先乘再減</h1>
    <p class="big" style="font-size:clamp(19px,5vw,24px)">公園有 8 排花盆，每排 5 盆。<br>有 23 盆開花了，還沒開花的有幾盆？</p>
    <div class="stage">
      <div class="pots" id="pots"></div>
      <div class="eqn" id="potE"></div>
      <div class="btns"><button id="potB1">① 先乘：一共幾盆？</button><button id="potB2">② 再減：沒開花幾盆？</button></div>
    </div>
  </section>

  <section class="step" data-auto="小測驗！一共三題，可以拿紙筆算一算。">
    <h1>✏️ 小測驗</h1>
    <div class="qbox">
      <p class="big">1. 58 ＋ 27 ＝ ？</p>
      <div class="quiz" data-why="個位 8 加 7 等於 15，寫 5 進 1。十位 5 加 2 再加進位的 1，等於 8。所以是 85。">
        <button>75</button><button data-right>85</button><button>715</button>
      </div>
      <div class="fb"></div>
    </div>
    <div class="qbox">
      <p class="big">2. 63 － 28 ＝ ？</p>
      <div class="quiz" data-why="個位 3 不夠減 8，向十位借 1，13 減 8 等於 5。十位 6 被借走 1 剩 5，5 減 2 等於 3。所以是 35。">
        <button>45</button><button>25</button><button data-right>35</button>
      </div>
      <div class="fb"></div>
    </div>
    <div class="qbox">
      <p class="big">3. 每包糖果 4 顆，買了 6 包，<br>吃掉 9 顆，還剩幾顆？</p>
      <div class="quiz" data-why="先乘：6 包，每包 4 顆，4 乘以 6 等於 24，四六二十四。再減：24 減 9 等於 15。所以還剩 15 顆。">
        <button data-right>15 顆</button><button>19 顆</button><button>33 顆</button>
      </div>
      <div class="fb"></div>
    </div>
  </section>
  <!-- ===== 教材內容結束 ===== -->
</main>
<script>
var NUM = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
function zh(n) { // 0～99 念法
  if (n < 10) return NUM[n];
  var t = Math.floor(n / 10), o = n % 10;
  return (t === 1 ? '十' : NUM[t] + '十') + (o ? NUM[o] : '');
}
function kou(a, b) { // 口訣：照算式寫的順序 a 在前
  var p = a * b, h = NUM[a] + NUM[b];
  if (p < 10) return h + '得' + NUM[p];
  if (p === 10) return h + '一十';
  return h + zh(p);
}
var GOODS = [['🪁', '風箏', 38], ['⚽', '皮球', 45], ['🫧', '泡泡水', 27], ['🧃', '果汁', 19]];
function shop(id, onPick) {
  var box = document.getElementById(id); box.innerHTML = '';
  GOODS.forEach(function (g, i) {
    var b = document.createElement('button');
    b.innerHTML = '<span class="e">' + g[0] + '</span><span class="n">' + g[1] + '</span><span class="p">' + g[2] + ' 元</span>';
    b.style.animationDelay = (i * 0.12) + 's';
    if (onPick) b.onclick = function () { onPick(i, b); };
    box.appendChild(b);
  });
  return box;
}
// 第 1 頁
var iT = [];
function intro() {
  iT.forEach(clearTimeout); iT = [];
  shop('introShop'); var e = document.getElementById('introE'); e.textContent = '';
  ['38 ＋ 45 ＝ ？', '90 － 27 ＝ ？', '5 × 8 ＝ ？'].forEach(function (t, i) { iT.push(setTimeout(function () { if (document.body.contains(e)) e.textContent = t; }, 900 + i * 1100)); });
}
document.getElementById('introAgain').onclick = intro;
// 直式
function digits(n) { return [Math.floor(n / 10), n % 10]; }
function cells(arr) { return arr.map(function (c) { return '<span class="' + (c[1] || '') + '">' + c[0] + '</span>'; }).join(''); }
// 第 2 頁：進位加法
var picks = [], aStep = 0;
var addBox = shop('addShop', function (i, b) {
  var k = picks.indexOf(i);
  if (k >= 0) picks.splice(k, 1); else { picks.push(i); if (picks.length > 2) picks.shift(); }
  [].forEach.call(addBox.children, function (x, j) { x.classList.toggle('on', picks.indexOf(j) >= 0); });
  say(GOODS[i][1] + GOODS[i][2] + '元');
  aStep = 0; drawAdd();
});
function drawAdd() {
  var V = document.getElementById('addV'), T = document.getElementById('addT');
  if (picks.length < 2) { V.innerHTML = ''; T.textContent = picks.length ? '再選一樣' : '先選兩樣東西'; return; }
  var a = GOODS[picks[0]][2], b = GOODS[picks[1]][2], A = digits(a), B = digits(b);
  var os = A[1] + B[1], carry = os >= 10 ? 1 : 0, ts = A[0] + B[0] + carry, sum = a + b;
  var showC = aStep >= 1 && carry, oneR = aStep >= 1 ? [os % 10, 'r'] : ['', ''], tenR = aStep >= 2 ? [ts, 'r'] : ['', ''];
  var hlO = aStep === 1 ? 'hl' : '', hlT = aStep === 2 ? 'hl' : '';
  V.innerHTML = cells([['', 'c'], [showC ? '1' : '', 'c'], ['', 'c'], ['', ''], [A[0], hlT], [A[1], hlO], ['＋', ''], [B[0], hlT], [B[1], hlO]]) + '<span class="ln"></span>' + cells([['', ''], tenR, oneR]);
  var msg = [
    GOODS[picks[0]][1] + ' ' + a + ' 元 ＋ ' + GOODS[picks[1]][1] + ' ' + b + ' 元，按「下一步」',
    '個位：' + A[1] + ' ＋ ' + B[1] + ' ＝ ' + os + (carry ? '，寫 ' + (os % 10) + '，進 1 到十位！' : '，寫 ' + os),
    '十位：' + A[0] + ' ＋ ' + B[0] + (carry ? ' ＋ 進位的 1' : '') + ' ＝ ' + ts + '。一共 ' + sum + ' 元！'
  ];
  T.textContent = msg[aStep];
}
document.getElementById('addStep').onclick = function () {
  if (picks.length < 2) { say('先選兩樣東西'); return; }
  aStep = (aStep + 1) % 3; drawAdd(); say(document.getElementById('addT').textContent);
};
// 第 3 頁：退位減法
var money = 90, sp = -1, sStep = 0;
(function () {
  var w = document.getElementById('wallet');
  [60, 90].forEach(function (m) {
    var b = document.createElement('button'); b.textContent = '💰 帶 ' + m + ' 元';
    if (m === money) b.classList.add('on');
    b.onclick = function () { money = m; [].forEach.call(w.children, function (x) { x.classList.toggle('on', x === b); }); sStep = 0; drawSub(); say('帶' + m + '元'); };
    w.appendChild(b);
  });
})();
var subBox = shop('subShop', function (i) {
  sp = i; sStep = 0;
  [].forEach.call(subBox.children, function (x, j) { x.classList.toggle('on', j === i); });
  say('買' + GOODS[i][1] + GOODS[i][2] + '元'); drawSub();
});
function drawSub() {
  var V = document.getElementById('subV'), T = document.getElementById('subT');
  if (sp < 0) { V.innerHTML = ''; T.textContent = '選一樣東西'; return; }
  var a = money, b = GOODS[sp][2], A = digits(a), B = digits(b), borrow = A[1] < B[1] ? 1 : 0;
  var on = A[1] + borrow * 10, od = on - B[1], tn = A[0] - borrow, td = tn - B[0];
  var bor = sStep >= 1 && borrow;
  var hlO = sStep === 1 ? 'hl' : '', hlT = sStep === 2 ? 'hl' : '';
  var oneR = sStep >= 1 ? [od, 'r'] : ['', ''], tenR = sStep >= 2 ? [td, 'r'] : ['', ''];
  V.innerHTML = cells([['', 'c'], [bor ? tn : '', 'c'], [bor ? on : '', 'c'], ['', ''], [A[0], (bor ? 'x ' : '') + hlT], [A[1], hlO], ['－', ''], [B[0], hlT], [B[1], hlO]]) + '<span class="ln"></span>' + cells([['', ''], tenR, oneR]);
  var msg = [
    '帶 ' + a + ' 元，買 ' + GOODS[sp][1] + ' ' + b + ' 元，按「下一步」',
    borrow ? '個位：' + A[1] + ' 不夠減 ' + B[1] + '，向十位借 1，變成 ' + on + '。' + on + ' － ' + B[1] + ' ＝ ' + od : '個位：' + A[1] + ' － ' + B[1] + ' ＝ ' + od,
    '十位：' + (borrow ? A[0] + ' 被借走 1 剩 ' + tn + '，' : '') + tn + ' － ' + B[0] + ' ＝ ' + td + '。還剩 ' + (a - b) + ' 元！'
  ];
  T.textContent = msg[sStep];
}
document.getElementById('subStep').onclick = function () {
  if (sp < 0) { say('先選一樣東西'); return; }
  sStep = (sStep + 1) % 3; drawSub(); say(document.getElementById('subT').textContent);
};
// 第 4 頁：乘法比大小
var C = [], ci = 0, cs = 0, cbusy = false;
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function makeC() {
  var list = [];
  while (list.length < 4) {
    var a = rnd(2, 9), b = rnd(2, 9), c = rnd(2, 9), d = rnd(2, 9);
    if (list.length === 2) { c = b; d = a; } // 一題「交換」會相等
    if (Math.abs(a * b - c * d) > 8) continue;
    if (list.length !== 2 && a * b === c * d) continue;
    list.push([a, b, c, d]);
  }
  return list.sort(function () { return Math.random() - 0.5; });
}
function showC() {
  var q = C[ci];
  document.getElementById('cL').textContent = q[0] + ' × ' + q[1];
  document.getElementById('cR').textContent = q[2] + ' × ' + q[3];
  document.getElementById('cB').textContent = '？';
}
function newC() { C = makeC(); ci = 0; cs = 0; cbusy = false; document.getElementById('cScore').textContent = ''; document.getElementById('cMsg').textContent = ''; showC(); }
[].forEach.call(document.querySelectorAll('#sym button'), function (b) {
  b.onclick = function () {
    if (cbusy || ci >= C.length) return;
    var q = C[ci], L = q[0] * q[1], R = q[2] * q[3], ans = L > R ? '>' : L < R ? '<' : '=';
    var why = kou(q[0], q[1]) + '，' + kou(q[2], q[3]) + '。';
    var M = document.getElementById('cMsg');
    if (b.textContent === ans) {
      cbusy = true; cs++; document.getElementById('cB').textContent = ans;
      document.getElementById('cScore').textContent = '⭐'.repeat(cs);
      M.style.color = '#0e6b2e';
      M.textContent = '✅ ' + why + ' ' + L + (ans === '>' ? ' 比 ' + R + ' 大' : ans === '<' ? ' 比 ' + R + ' 小' : ' 和 ' + R + ' 一樣大');
      say('答對了！' + why);
      setTimeout(function () {
        if (!document.getElementById('cMsg')) return;
        ci++; cbusy = false;
        if (ci < C.length) { showC(); M.textContent = ''; }
        else { M.textContent = '🎉 四題全對，好厲害！'; say('四題全對，好厲害！'); }
      }, 2600);
    } else { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); M.style.color = '#a0161b'; M.textContent = '再想想看！先用口訣算出兩邊。'; say('再想想看，先用口訣算出兩邊'); }
  };
});
document.getElementById('cAgain').onclick = function () { newC(); say('再玩一次'); };
newC();
// 第 5 頁：先乘再減
var ROWS = 8, PER = 5, DONE = 23;
function drawPots(stage) {
  var box = document.getElementById('pots'); box.innerHTML = '';
  for (var i = 0; i < ROWS * PER; i++) {
    var p = document.createElement('div'); p.className = 'pot';
    if (stage === 2) { p.className += i < DONE ? ' done' : ' left'; p.textContent = i < DONE ? '🌷' : '🪴'; }
    else p.textContent = '🪴';
    p.style.animationDelay = (stage === 1 ? Math.floor(i / PER) * 0.15 : 0) + 's';
    box.appendChild(p);
  }
}
document.getElementById('potB1').onclick = function () {
  drawPots(1);
  document.getElementById('potE').innerHTML = PER + ' × ' + ROWS + ' ＝ <span class="r">' + (PER * ROWS) + '</span> 盆';
  say('每排五盆，有八排，五乘以八等於四十，' + kou(PER, ROWS) + '。一共四十盆。');
};
document.getElementById('potB2').onclick = function () {
  drawPots(2);
  document.getElementById('potE').innerHTML = PER + ' × ' + ROWS + ' ＝ ' + (PER * ROWS) + '<br>' + (PER * ROWS) + ' － ' + DONE + ' ＝ <span class="r">' + (PER * ROWS - DONE) + '</span> 盆';
  say('四十盆裡，有二十三盆開花了。四十減二十三等於十七。還沒開花的有十七盆。');
};
window.onStep = function (i) {
  if (i === 0) intro();
  if (i === 4) { drawPots(0); document.getElementById('potE').textContent = ''; }
};
</script>

<script>
/* ===== 共用程式（不要改） ===== */
function pickVoice(lang, want) {
  var BAD = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|fred|good news|hysterical|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|eloquence/i;
  var GOOD = ['samantha', 'ava', 'allison', 'susan', 'zoe', 'nicky', 'joelle', 'evan', 'nathan', 'tom', 'aaron', 'google us english', 'microsoft aria', 'microsoft jenny', 'microsoft guy'];
  var all = speechSynthesis.getVoices(), best = null, bestScore = -1;
  for (var i = 0; i < all.length; i++) {
    var v = all[i], l = v.lang.replace('_', '-').toLowerCase();
    if (l.indexOf(lang.toLowerCase().slice(0, 2)) !== 0) continue;
    if (want && v.name === want) return v;
    if (BAD.test(v.name)) continue;
    var n = v.name.toLowerCase(), sc = l.indexOf(lang.toLowerCase()) === 0 ? 5 : 0;
    if (/premium/.test(n)) sc += 30;
    if (/enhanced|neural|natural/.test(n)) sc += 20;
    for (var g = 0; g < GOOD.length; g++) if (n.indexOf(GOOD[g]) >= 0) { sc += 15 - g * 0.5; break; }
    if (sc > bestScore) { best = v; bestScore = sc; }
  }
  return best;
}
function say(t, lang, rate) {
  try {
    speechSynthesis.cancel();
    var P = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) P[p[0]] = decodeURIComponent(p[1] || ''); });
    var u = new SpeechSynthesisUtterance(t);
    u.lang = lang || 'zh-TW';
    var en = u.lang.indexOf('en') === 0;
    u.rate = rate || (en ? (parseFloat(P.rate) || 0.75) : 0.9);
    var v = pickVoice(u.lang, en ? P.voice : '');
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
var steps = [].slice.call(document.querySelectorAll('.step')), cur = 0, prog = document.querySelector('.prog');
steps.forEach(function () { prog.appendChild(document.createElement('i')); });
function go(n) {
  cur = Math.max(0, Math.min(steps.length - 1, n));
  steps.forEach(function (s, i) { s.classList.toggle('on', i === cur); });
  [].forEach.call(prog.children, function (d, i) { d.classList.toggle('on', i <= cur); });
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = cur === steps.length - 1 ? '🎉 學完了' : '下一步 ▶';
  window.scrollTo(0, 0);
  var s = steps[cur];
  if (s.dataset.auto) say(s.dataset.auto, s.dataset.lang);
  if (window.onStep) window.onStep(cur, s);
}
document.getElementById('prev').onclick = function () { go(cur - 1); };
document.getElementById('next').onclick = function () {
  if (cur < steps.length - 1) return go(cur + 1);
  document.querySelector('.wrap').innerHTML = '<h1 style="margin-top:40px">🎉 學完了！</h1><p class="big">Ivan勇士好棒！<br>按左上角的 ✕ 回到今日任務。</p><p class="center" style="font-size:90px">🏆</p>';
  document.querySelector('.nav').remove();
  say('學完了！Ivan勇士好棒！');
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) say(b.dataset.say, b.dataset.lang); });
[].forEach.call(document.querySelectorAll('.quiz'), function (q) {
  q.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || q.dataset.done) return;
    var fb = q.parentNode.querySelector('.fb'), ok = b.hasAttribute('data-right');
    b.classList.add(ok ? 'right' : 'wrong');
    if (ok) { q.dataset.done = 1; fb.style.color = '#0e6b2e'; fb.textContent = '🎉 答對了！' + (q.dataset.why || ''); say('答對了！' + (q.dataset.why || '')); }
    else { fb.style.color = '#a0161b'; fb.textContent = '再想想看！'; say('再想想看'); }
  });
});
go(0);
</script>
