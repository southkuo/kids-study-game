<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光和影子</title>
<style>
:root { --c: #2e9d5b; --ink: #2b2112; --bg: #fffaf0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
.prog { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.prog i { width: 14px; height: 14px; border-radius: 50%; background: #e0d6c3; }
.prog i.on { background: var(--c); }
.step { display: none; }
.step.on { display: block; animation: stepIn .45s ease-out; }
@keyframes stepIn { from { opacity: 0; transform: translateY(18px); } }
h1 { margin: 6px 0 10px; font-size: clamp(26px, 6.5vw, 38px); text-align: center; color: var(--c); }
.big { font-size: clamp(21px, 5.4vw, 29px); font-weight: 900; line-height: 1.55; text-align: center; margin: 8px 0; }
.small { font-size: 17px; font-weight: 700; text-align: center; color: #6a5536; }
.stage { position: relative; min-height: 240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; padding: 16px; border-radius: 24px; background: #fff; box-shadow: 0 5px 0 #eadfc8; overflow: hidden; }
.say { display: inline-flex; align-items: center; gap: 6px; margin: 6px; padding: 10px 18px; border: 0; border-radius: 999px; background: #e3f2fd; box-shadow: 0 3px 0 #90caf9; font: inherit; font-size: 18px; font-weight: 900; color: #0d47a1; cursor: pointer; }
.say:active { transform: translateY(2px); }
.center { text-align: center; }
.card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; padding: 12px 14px; border: 0; border-radius: 20px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; cursor: pointer; }
.card:active { transform: translateY(3px); }
.quiz { display: grid; gap: 10px; margin-top: 12px; }
.quiz button { min-height: 60px; padding: 8px 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 #d6c39a; font: inherit; font-size: clamp(19px, 5vw, 24px); font-weight: 900; color: var(--ink); cursor: pointer; }
.quiz button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.quiz button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.fb { min-height: 1.6em; margin-top: 10px; text-align: center; font-size: 20px; font-weight: 900; color: #0e6b2e; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,250,240,.96); box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
.nav button { flex: 1; min-height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
#prev { background: #fff; box-shadow: 0 4px 0 #d7c3ad; color: var(--ink); }
#next { background: linear-gradient(180deg, #ffe38a, #ffc93c 55%, #e09a12); box-shadow: 0 4px 0 #9a6608; color: #3a2208; }
.nav button:disabled { opacity: .4; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
/* ===== 自訂樣式 ===== */
.stage svg{width:100%;max-width:520px;height:auto;display:block}
.beam{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
.bounce{animation:hop 1.4s ease-in-out infinite;transform-origin:center bottom;transform-box:fill-box}
@keyframes hop{50%{transform:translateY(-10px)}}
.btn{min-height:56px;padding:8px 20px;border:0;border-radius:999px;background:#2e9d5b;box-shadow:0 4px 0 #1b6a3b;color:#fff;font:inherit;font-size:20px;font-weight:900;cursor:pointer}
.btn.off{background:#555;box-shadow:0 4px 0 #222}
input[type=range]{width:min(100%,420px);height:40px;accent-color:#2e9d5b}
.time{font-size:24px;font-weight:900;text-align:center;color:var(--c)}
.shapes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.shapes button{min-width:72px;min-height:64px;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #b8dcc5;font-size:40px;cursor:pointer}
.shapes button.on{background:#d8f7e1;box-shadow:0 4px 0 #2e9d5b}
.wall{position:relative;width:100%;max-width:460px;height:200px;border-radius:18px;background:linear-gradient(90deg,#fff8d6,#fffbea);display:flex;align-items:center;justify-content:space-around}
.obj{font-size:64px}
.shd{font-size:110px;filter:brightness(0);opacity:.75;transition:transform .5s}
.lamp{font-size:44px}
</style>
</head>
<body>
<main class="wrap">
  <div class="prog"></div>

  <!-- ===== 教材內容：每一頁一個 section.step ===== -->
<section class="step" data-auto="手電筒一照，牆上出現了影子！影子是怎麼來的呢？">
    <h1>光和影子</h1>
    <div class="stage" style="background:#1f2a44">
      <svg viewBox="0 0 400 220" aria-hidden="true">
        <polygon class="beam" points="70,110 330,20 330,200" fill="#fff6a8" opacity=".85"/>
        <text x="20" y="128" font-size="52">🔦</text>
        <rect x="330" y="10" width="60" height="200" fill="#f1e7c8"/>
        <text x="185" y="132" font-size="50" class="bounce">🐰</text>
        <ellipse cx="358" cy="116" rx="22" ry="42" fill="#333" opacity=".8" class="beam"/>
      </svg>
    </div>
    <p class="big">光被擋住，<br>就會出現<span style="color:var(--c)">影子</span>！</p>
    <p class="center"><button class="say" data-say="光被擋住，就會出現影子。">🔊 聽一聽</button></p>
  </section>

  <section class="step" data-auto="光是直直走的。光照到球，被球擋住了，球的後面照不到光，就變暗，這就是影子。按按鈕，把燈關掉看看。">
    <h1>影子怎麼來？</h1>
    <div class="stage">
      <svg viewBox="0 0 420 220" id="lampSvg" aria-hidden="true">
        <rect x="0" y="0" width="420" height="220" fill="#fffbea" id="room"/>
        <g id="rays" stroke="#f5c400" stroke-width="4" stroke-dasharray="10 8">
          <line x1="60" y1="110" x2="190" y2="84"/><line x1="60" y1="110" x2="190" y2="136"/>
          <line x1="60" y1="110" x2="410" y2="10"/><line x1="60" y1="110" x2="410" y2="210"/>
        </g>
        <circle cx="60" cy="110" r="22" fill="#ffd54f" id="bulb"/>
        <polygon points="200,82 200,138 410,180 410,40" fill="#555" opacity=".55" id="shadow"/>
        <circle cx="200" cy="110" r="28" fill="#e85d5d"/>
        <rect x="408" y="0" width="12" height="220" fill="#c9b98f"/>
      </svg>
    </div>
    <p class="big" id="lampTxt">光直直走，被球擋住，<br>後面照不到光 → 影子</p>
    <p class="center"><button class="btn" id="lampBtn">💡 關燈</button></p>
  </section>

  <section class="step" data-auto="太陽也會讓東西有影子。拉拉看，從早上到傍晚，樹的影子怎麼變？">
    <h1>太陽和影子</h1>
    <div class="stage" style="padding:8px">
      <svg viewBox="0 0 420 240" aria-hidden="true">
        <rect width="420" height="240" fill="#dff1ff"/>
        <path d="M30,200 Q210,-40 390,200" fill="none" stroke="#9fc9ea" stroke-width="2" stroke-dasharray="6 6"/>
        <rect y="200" width="420" height="40" fill="#9bd38a"/>
        <text x="8" y="232" font-size="18" font-weight="900" fill="#1b5e20">東</text>
        <text x="392" y="232" font-size="18" font-weight="900" fill="#1b5e20">西</text>
        <polygon id="tshadow" points="200,200 220,200 300,214 290,214" fill="#24331f" opacity=".7"/>
        <rect x="204" y="130" width="12" height="70" fill="#8d5a2b"/>
        <circle cx="210" cy="120" r="32" fill="#43a047"/>
        <circle id="sun" cx="40" cy="190" r="20" fill="#ffca28" stroke="#ffb300" stroke-width="4"/>
      </svg>
    </div>
    <p class="center"><input type="range" id="tm" min="0" max="100" value="10"></p>
    <p class="time" id="tmTxt"></p>
    <p class="small">太陽低，影子長；太陽高，影子短。<br>影子在太陽的相反那一邊。</p>
  </section>

  <section class="step" data-auto="影子的形狀，和擋住光的東西很像。點一點，看看影子變成什麼樣子。">
    <h1>猜猜影子</h1>
    <div class="stage" style="flex-direction:column">
      <div class="wall"><span class="lamp">🔦</span><span class="obj" id="obj">🐰</span><span class="shd" id="shd">🐰</span></div>
      <div class="shapes" id="shapes"></div>
    </div>
    <p class="small">影子是黑黑的，看不到顏色，<br>但是看得出外面的形狀（輪廓）。</p>
  </section>

  <section class="step" data-auto="小測驗。手電筒從左邊照過來，影子會在哪一邊？">
    <h1>小測驗 1</h1>
    <p class="big">🔦 從<span style="color:var(--c)">左邊</span>照過來，<br>影子會在哪一邊？</p>
    <p class="center"><button class="say" data-say="手電筒從左邊照過來，影子會在哪一邊？">🔊 聽題目</button></p>
    <div class="quiz" data-why="光是直直走的，被東西擋住後，照不到光的地方在東西的另一邊。光從左邊來，影子就在右邊。">
      <button>左邊</button><button data-right>右邊</button><button>沒有影子</button>
    </div>
    <div class="fb"></div>
  </section>

  <section class="step" data-auto="小測驗。晴天的時候，什麼時候人的影子最短？">
    <h1>小測驗 2</h1>
    <p class="big">晴天的時候，什麼時候<br>人的影子最短？</p>
    <p class="center"><button class="say" data-say="晴天的時候，什麼時候人的影子最短？">🔊 聽題目</button></p>
    <div class="quiz" data-why="中午太陽在天空比較高的地方，影子最短。早上和傍晚太陽比較低，影子比較長。">
      <button>🌅 早上</button><button data-right>🌞 中午</button><button>🌇 傍晚</button>
    </div>
    <div class="fb"></div>
  </section>
  <!-- ===== 教材內容結束 ===== -->
</main>
<script>
(function(){
var on=true,btn=document.getElementById('lampBtn');
btn.onclick=function(){
 on=!on;
 document.getElementById('rays').style.display=on?'':'none';
 document.getElementById('shadow').style.display=on?'':'none';
 document.getElementById('bulb').setAttribute('fill',on?'#ffd54f':'#777');
 document.getElementById('room').setAttribute('fill',on?'#fffbea':'#3a3f4f');
 btn.textContent=on?'💡 關燈':'💡 開燈';btn.classList.toggle('off',!on);
 var t=on?'光直直走，被球擋住，<br>後面照不到光 → 影子':'燈關了，四周都暗暗的，<br>看不到影子了！';
 document.getElementById('lampTxt').innerHTML=t;
 say(on?'開燈了，光被球擋住，影子又出現了。':'燈關了，沒有光，就看不到影子。');
};
/* 太陽：沿著拱形從東（左）走到西（右）；樹高 h，影子長 = h ÷ tan(太陽仰角) */
var tm=document.getElementById('tm'),sun=document.getElementById('sun'),sh=document.getElementById('tshadow');
var last='';
function sunUpd(speak){
 var t=+tm.value/100;
 var x=30+360*t, y=(1-t)*(1-t)*200+2*(1-t)*t*(-40)+t*t*200; /* 和虛線拱形同一條曲線 */
 var px=30+2*(1-t)*t*180+t*t*360; x=px;
 sun.setAttribute('cx',x.toFixed(1));sun.setAttribute('cy',(y-10).toFixed(1));
 var dx=x-210, dy=200-(y-10); var elev=Math.atan2(Math.max(dy,4),Math.abs(dx)||0.001);
 var h=90, L=Math.min(200,h/Math.tan(elev)); var dir=dx>0?-1:1; L=Math.max(L,14);
 var tip=210+dir*L;
 sh.setAttribute('points',[210,201,(tip),203,(tip+dir*4),207,(tip),211,210,215].join(' '));
 var name=t<0.3?'早上':(t<0.7?'中午':'傍晚');
 var len=L>120?'很長':(L>60?'比較長':'很短');
 document.getElementById('tmTxt').textContent=(t<0.3?'🌅 ':t<0.7?'🌞 ':'🌇 ')+name+'：影子'+len;
 if(speak&&name+len!==last)say(name+'，太陽'+(t<0.3||t>=0.7?'比較低':'比較高')+'，影子'+len+'。');
 last=name+len;
}
tm.oninput=function(){sunUpd(false);};tm.onchange=function(){sunUpd(true);};sunUpd(false);
var SH=['🐰','🐦','🐶','✋','🌳'],box=document.getElementById('shapes');
var NM={'🐰':'兔子','🐦':'小鳥','🐶':'小狗','✋':'手','🌳':'樹'};
SH.forEach(function(e,i){var b=document.createElement('button');b.textContent=e;if(!i)b.classList.add('on');
 b.onclick=function(){[].forEach.call(box.children,function(x){x.classList.toggle('on',x===b);});document.getElementById('obj').textContent=e;var s=document.getElementById('shd');s.textContent=e;s.style.transform='scale(.6)';setTimeout(function(){s.style.transform='';},60);say(NM[e]+'的影子，形狀和'+NM[e]+'一樣。');};
 box.appendChild(b);});
})();
</script>
<nav class="nav"><button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button></nav>
<script>
/* ===== 共用程式（不要改） ===== */
function pickVoice(lang, want) {
  var BAD = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|fred|good news|hysterical|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|eloquence/i;
  var GOOD = ['samantha', 'ava', 'allison', 'susan', 'zoe', 'nicky', 'joelle', 'evan', 'nathan', 'tom', 'aaron', 'google us english', 'microsoft aria', 'microsoft jenny', 'microsoft guy'];
  var all = speechSynthesis.getVoices(), best = null, bestScore = -1;
  for (var i = 0; i < all.length; i++) {
    var v = all[i], l = v.lang.replace('_', '-').toLowerCase();
    if (l.indexOf(lang.toLowerCase().slice(0, 2)) !== 0) continue;
    if (want && v.name === want) return v;
    if (BAD.test(v.name)) continue;
    var n = v.name.toLowerCase(), sc = l.indexOf(lang.toLowerCase()) === 0 ? 5 : 0;
    if (/premium/.test(n)) sc += 30;
    if (/enhanced|neural|natural/.test(n)) sc += 20;
    for (var g = 0; g < GOOD.length; g++) if (n.indexOf(GOOD[g]) >= 0) { sc += 15 - g * 0.5; break; }
    if (sc > bestScore) { best = v; bestScore = sc; }
  }
  return best;
}
function say(t, lang, rate) {
  try {
    speechSynthesis.cancel();
    var P = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) P[p[0]] = decodeURIComponent(p[1] || ''); });
    var u = new SpeechSynthesisUtterance(t);
    u.lang = lang || 'zh-TW';
    var en = u.lang.indexOf('en') === 0;
    u.rate = rate || (en ? (parseFloat(P.rate) || 0.75) : 0.9);
    var v = pickVoice(u.lang, en ? P.voice : '');
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
var steps = [].slice.call(document.querySelectorAll('.step')), cur = 0, prog = document.querySelector('.prog');
steps.forEach(function () { prog.appendChild(document.createElement('i')); });
function go(n) {
  cur = Math.max(0, Math.min(steps.length - 1, n));
  steps.forEach(function (s, i) { s.classList.toggle('on', i === cur); });
  [].forEach.call(prog.children, function (d, i) { d.classList.toggle('on', i <= cur); });
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = cur === steps.length - 1 ? '🎉 學完了' : '下一步 ▶';
  window.scrollTo(0, 0);
  var s = steps[cur];
  if (s.dataset.auto) say(s.dataset.auto, s.dataset.lang);
  if (window.onStep) window.onStep(cur, s);
}
document.getElementById('prev').onclick = function () { go(cur - 1); };
document.getElementById('next').onclick = function () {
  if (cur < steps.length - 1) return go(cur + 1);
  document.querySelector('.wrap').innerHTML = '<h1 style="margin-top:40px">🎉 學完了！</h1><p class="big">Ivan勇士好棒！<br>按左上角的 ✕ 回到今日任務。</p><p class="center" style="font-size:90px">🏆</p>';
  document.querySelector('.nav').remove();
  say('學完了！Ivan勇士好棒！');
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) say(b.dataset.say, b.dataset.lang); });
[].forEach.call(document.querySelectorAll('.quiz'), function (q) {
  q.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || q.dataset.done) return;
    var fb = q.parentNode.querySelector('.fb'), ok = b.hasAttribute('data-right');
    b.classList.add(ok ? 'right' : 'wrong');
    if (ok) { q.dataset.done = 1; fb.style.color = '#0e6b2e'; fb.textContent = '🎉 答對了！' + (q.dataset.why || ''); say('答對了！' + (q.dataset.why || '')); }
    else { fb.style.color = '#a0161b'; fb.textContent = '再想想看！'; say('再想想看'); }
  });
});
go(0);
</script>
</body>
</html>
