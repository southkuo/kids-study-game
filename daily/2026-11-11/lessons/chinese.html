<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相反詞</title>
<style>
:root { --c: #c0573b; --ink: #2b2112; --bg: #fffaf0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
.prog { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.prog i { width: 14px; height: 14px; border-radius: 50%; background: #e0d6c3; }
.prog i.on { background: var(--c); }
.step { display: none; }
.step.on { display: block; animation: stepIn .45s ease-out; }
@keyframes stepIn { from { opacity: 0; transform: translateY(18px); } }
h1 { margin: 6px 0 10px; font-size: clamp(26px, 6.5vw, 38px); text-align: center; color: var(--c); }
.big { font-size: clamp(21px, 5.4vw, 29px); font-weight: 900; line-height: 1.55; text-align: center; margin: 8px 0; }
.small { font-size: 17px; font-weight: 700; text-align: center; color: #6a5536; }
.stage { position: relative; min-height: 240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; padding: 16px; border-radius: 24px; background: #fff; box-shadow: 0 5px 0 #eadfc8; overflow: hidden; }
.say { display: inline-flex; align-items: center; gap: 6px; margin: 6px; padding: 10px 18px; border: 0; border-radius: 999px; background: #e3f2fd; box-shadow: 0 3px 0 #90caf9; font: inherit; font-size: 18px; font-weight: 900; color: #0d47a1; cursor: pointer; }
.say:active { transform: translateY(2px); }
.center { text-align: center; }
.card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; padding: 12px 14px; border: 0; border-radius: 20px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; cursor: pointer; }
.card:active { transform: translateY(3px); }
.quiz { display: grid; gap: 10px; margin-top: 12px; }
.quiz button { min-height: 60px; padding: 8px 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 #d6c39a; font: inherit; font-size: clamp(19px, 5vw, 24px); font-weight: 900; color: var(--ink); cursor: pointer; }
.quiz button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.quiz button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.fb { min-height: 1.6em; margin-top: 10px; text-align: center; font-size: 20px; font-weight: 900; color: #0e6b2e; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,250,240,.96); box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
.nav button { flex: 1; min-height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
#prev { background: #fff; box-shadow: 0 4px 0 #d7c3ad; color: var(--ink); }
#next { background: linear-gradient(180deg, #ffe38a, #ffc93c 55%, #e09a12); box-shadow: 0 4px 0 #9a6608; color: #3a2208; }
.nav button:disabled { opacity: .4; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
/* ===== 自訂樣式 ===== */
.pair{display:flex;align-items:center;justify-content:center;gap:18px;width:100%}
.side{display:flex;flex-direction:column;align-items:center;padding:12px 18px;border-radius:22px;background:#fff3ee;box-shadow:0 4px 0 #f0c9b8;min-width:120px}
.side .e{font-size:64px;line-height:1.1}
.side .w{font-size:40px;font-weight:900;color:var(--c)}
.side.l{animation:inL .7s ease-out both}
.side.r{animation:inR .7s ease-out .5s both}
@keyframes inL{from{transform:translateX(-120px);opacity:0}}
@keyframes inR{from{transform:translateX(120px);opacity:0}}
.vs{font-size:34px;font-weight:900;color:#c99a3b;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;width:100%}
.flip{position:relative;min-height:130px;border:0;padding:0;background:none;font:inherit;cursor:pointer;perspective:600px}
.flip .in{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:20px;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flip .f{background:#fff3ee;box-shadow:0 4px 0 #f0c9b8}
.flip .b{background:#e8f1ff;box-shadow:0 4px 0 #a9c4f0;transform:rotateY(180deg)}
.flip .e{font-size:42px}
.flip .w{font-size:32px;font-weight:900;color:var(--c)}
.flip .b .w{color:#2a5bb8}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;width:100%;max-width:420px}
.match button{min-height:60px;border:0;border-radius:18px;background:#fff7ec;box-shadow:0 4px 0 #f0d9b5;font:inherit;font-size:28px;font-weight:900;color:var(--ink);cursor:pointer}
.match button.sel{background:#ffe38a;box-shadow:0 4px 0 #c79a1a}
.match button.ok{background:#d8f7e1;box-shadow:0 4px 0 #2fb35a;color:#0e6b2e}
.match button.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tip{display:inline-block;padding:8px 14px;border-radius:14px;background:#fff3ee;font-size:19px;font-weight:900;margin:4px}
</style>
</head>
<body>
<main class="wrap">
  <div class="prog"></div>

  <!-- ===== 教材內容：每一頁一個 section.step ===== -->
<section class="step" data-auto="大象很大，螞蟻很小。大和小，意思剛好相反。像這樣意思剛好相反的兩個詞，叫做相反詞。">
    <h1>相反詞</h1>
    <div class="stage" id="open">
      <div class="pair">
        <div class="side l"><span class="e">🐘</span><span class="w">大</span></div>
        <span class="vs">⇄</span>
        <div class="side r"><span class="e">🐜</span><span class="w">小</span></div>
      </div>
    </div>
    <p class="big">意思<span style="color:var(--c)">剛好相反</span>的兩個詞，<br>叫做「相反詞」。</p>
    <p class="center"><button class="say" data-say="意思剛好相反的兩個詞，叫做相反詞。">🔊 聽一聽</button></p>
  </section>

  <section class="step" data-auto="相反詞要說同一件事。快和慢，說的都是速度。兔子跑得快，烏龜走得慢。">
    <h1>說同一件事</h1>
    <div class="stage">
      <div class="pair">
        <div class="side l"><span class="e">🐇</span><span class="w">快</span></div>
        <span class="vs">⇄</span>
        <div class="side r"><span class="e">🐢</span><span class="w">慢</span></div>
      </div>
    </div>
    <p class="big">快和慢，說的都是<span style="color:var(--c)">速度</span>。</p>
    <p class="center">
      <button class="say" data-say="兔子跑得快，烏龜走得慢。">🔊 兔子跑得快，烏龜走得慢</button>
    </p>
    <p class="small">多和少說「數量」，大和小說「大小」。<br>所以「小」的相反是「大」，不是「多」喔！</p>
  </section>

  <section class="step" data-auto="點一點卡片，翻過來看看它的相反詞。">
    <h1>翻翻卡</h1>
    <p class="small">點卡片，翻過來看相反詞 👇</p>
    <div class="stage"><div class="flips" id="flips"></div></div>
  </section>

  <section class="step" data-auto="配對遊戲。先點左邊的詞，再點右邊和它意思相反的詞。">
    <h1>配對遊戲</h1>
    <p class="small">先點左邊，再點右邊的相反詞</p>
    <div class="stage"><div class="match" id="match"></div></div>
    <p class="big" id="mres"></p>
  </section>

  <section class="step" data-auto="小測驗。長的相反詞是哪一個？">
    <h1>小測驗 1</h1>
    <p class="big">「長」的相反詞是哪一個？</p>
    <p class="center"><button class="say" data-say="長的相反詞是哪一個？">🔊 聽題目</button></p>
    <div class="quiz" data-why="長和短說的都是長度。鉛筆用久了，會從長長的變成短短的。">
      <button>高</button><button data-right>短</button><button>小</button>
    </div>
    <div class="fb"></div>
  </section>

  <section class="step" data-auto="小測驗。下面哪一組，不是相反詞？">
    <h1>小測驗 2</h1>
    <p class="big">哪一組「不是」相反詞？</p>
    <p class="center"><button class="say" data-say="下面哪一組，不是相反詞？">🔊 聽題目</button></p>
    <div class="quiz" data-why="輕和重、早和晚、左和右都是相反詞。「冷」的相反是「熱」，「少」的相反是「多」，所以冷和少不是一對。">
      <button>輕－重</button><button>早－晚</button><button data-right>冷－少</button><button>左－右</button>
    </div>
    <div class="fb"></div>
  </section>
  <!-- ===== 教材內容結束 ===== -->
</main>
<script>
(function(){
var CARDS=[
 ['🌞','熱','🥶','冷','夏天很熱，冬天很冷。'],
 ['🚪','開','🚪','關','開門，關門。'],
 ['😄','笑','😢','哭','開心的時候笑，傷心的時候哭。'],
 ['🍬🍬🍬','多','🍬','少','三顆糖比較多，一顆糖比較少。'],
 ['⬆️','上','⬇️','下','往上爬，往下滑。'],
 ['⚪','白','⚫','黑','白色和黑色。']
];
var box=document.getElementById('flips');
CARDS.forEach(function(c){
 var b=document.createElement('button');b.className='flip';
 b.innerHTML='<div class="in"><div class="f"><span class="e">'+c[0]+'</span><span class="w">'+c[1]+'</span></div><div class="b"><span class="e">'+c[2]+'</span><span class="w">'+c[3]+'</span></div></div>';
 b.onclick=function(){b.classList.toggle('on');say(c[1]+'的相反詞是'+c[3]+'。'+c[4]);};
 box.appendChild(b);
});
var PAIRS=[['高','矮'],['胖','瘦'],['前','後'],['新','舊']];
var m=document.getElementById('match'),res=document.getElementById('mres'),pick=null,done=0;
function build(){
 m.innerHTML='';pick=null;done=0;res.textContent='';
 var right=PAIRS.map(function(p){return p[1];});
 right=[right[2],right[0],right[3],right[1]];
 PAIRS.forEach(function(p,i){
  var a=document.createElement('button');a.textContent=p[0];a.dataset.k=p[0];
  a.onclick=function(){if(a.classList.contains('ok'))return;[].forEach.call(m.querySelectorAll('.sel'),function(x){x.classList.remove('sel');});a.classList.add('sel');pick=p;say(p[0]);};
  var b=document.createElement('button');b.textContent=right[i];
  b.onclick=function(){
   if(b.classList.contains('ok'))return;
   if(!pick){say('先點左邊的詞');return;}
   if(pick[1]===b.textContent){
    b.classList.add('ok');m.querySelector('.sel').classList.replace('sel','ok');
    say(pick[0]+'，'+pick[1]+'，對了！');pick=null;done++;
    if(done===PAIRS.length){res.textContent='🎉 全部配對成功！';setTimeout(function(){say('全部配對成功！');},900);}
   }else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');say('再想想看');}
  };
  m.appendChild(a);m.appendChild(b);
 });
}
build();
window.onStep=function(i,s){
 if(i===0||i===1){[].forEach.call(s.querySelectorAll('.side'),function(x){x.style.animation='none';void x.offsetWidth;x.style.animation='';});}
 if(i===3&&done===PAIRS.length)build();
};
})();
</script>
<nav class="nav"><button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button></nav>
<script>
/* ===== 共用程式（不要改） ===== */
function pickVoice(lang, want) {
  var BAD = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|fred|good news|hysterical|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|eloquence/i;
  var GOOD = ['samantha', 'ava', 'allison', 'susan', 'zoe', 'nicky', 'joelle', 'evan', 'nathan', 'tom', 'aaron', 'google us english', 'microsoft aria', 'microsoft jenny', 'microsoft guy'];
  var all = speechSynthesis.getVoices(), best = null, bestScore = -1;
  for (var i = 0; i < all.length; i++) {
    var v = all[i], l = v.lang.replace('_', '-').toLowerCase();
    if (l.indexOf(lang.toLowerCase().slice(0, 2)) !== 0) continue;
    if (want && v.name === want) return v;
    if (BAD.test(v.name)) continue;
    var n = v.name.toLowerCase(), sc = l.indexOf(lang.toLowerCase()) === 0 ? 5 : 0;
    if (/premium/.test(n)) sc += 30;
    if (/enhanced|neural|natural/.test(n)) sc += 20;
    for (var g = 0; g < GOOD.length; g++) if (n.indexOf(GOOD[g]) >= 0) { sc += 15 - g * 0.5; break; }
    if (sc > bestScore) { best = v; bestScore = sc; }
  }
  return best;
}
function say(t, lang, rate) {
  try {
    speechSynthesis.cancel();
    var P = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) P[p[0]] = decodeURIComponent(p[1] || ''); });
    var u = new SpeechSynthesisUtterance(t);
    u.lang = lang || 'zh-TW';
    var en = u.lang.indexOf('en') === 0;
    u.rate = rate || (en ? (parseFloat(P.rate) || 0.75) : 0.9);
    var v = pickVoice(u.lang, en ? P.voice : '');
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
var steps = [].slice.call(document.querySelectorAll('.step')), cur = 0, prog = document.querySelector('.prog');
steps.forEach(function () { prog.appendChild(document.createElement('i')); });
function go(n) {
  cur = Math.max(0, Math.min(steps.length - 1, n));
  steps.forEach(function (s, i) { s.classList.toggle('on', i === cur); });
  [].forEach.call(prog.children, function (d, i) { d.classList.toggle('on', i <= cur); });
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = cur === steps.length - 1 ? '🎉 學完了' : '下一步 ▶';
  window.scrollTo(0, 0);
  var s = steps[cur];
  if (s.dataset.auto) say(s.dataset.auto, s.dataset.lang);
  if (window.onStep) window.onStep(cur, s);
}
document.getElementById('prev').onclick = function () { go(cur - 1); };
document.getElementById('next').onclick = function () {
  if (cur < steps.length - 1) return go(cur + 1);
  document.querySelector('.wrap').innerHTML = '<h1 style="margin-top:40px">🎉 學完了！</h1><p class="big">Ivan勇士好棒！<br>按左上角的 ✕ 回到今日任務。</p><p class="center" style="font-size:90px">🏆</p>';
  document.querySelector('.nav').remove();
  say('學完了！Ivan勇士好棒！');
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) say(b.dataset.say, b.dataset.lang); });
[].forEach.call(document.querySelectorAll('.quiz'), function (q) {
  q.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || q.dataset.done) return;
    var fb = q.parentNode.querySelector('.fb'), ok = b.hasAttribute('data-right');
    b.classList.add(ok ? 'right' : 'wrong');
    if (ok) { q.dataset.done = 1; fb.style.color = '#0e6b2e'; fb.textContent = '🎉 答對了！' + (q.dataset.why || ''); say('答對了！' + (q.dataset.why || '')); }
    else { fb.style.color = '#a0161b'; fb.textContent = '再想想看！'; say('再想想看'); }
  });
});
go(0);
</script>
</body>
</html>
