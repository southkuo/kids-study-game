<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Time Is It?</title>
<style>
:root { --c: #3f6fe0; --ink: #2b2112; --bg: #fffaf0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
.prog { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.prog i { width: 14px; height: 14px; border-radius: 50%; background: #e0d6c3; }
.prog i.on { background: var(--c); }
.step { display: none; }
.step.on { display: block; animation: stepIn .45s ease-out; }
@keyframes stepIn { from { opacity: 0; transform: translateY(18px); } }
h1 { margin: 6px 0 10px; font-size: clamp(26px, 6.5vw, 38px); text-align: center; color: var(--c); }
.big { font-size: clamp(21px, 5.4vw, 29px); font-weight: 900; line-height: 1.55; text-align: center; margin: 8px 0; }
.small { font-size: 17px; font-weight: 700; text-align: center; color: #6a5536; }
.stage { position: relative; min-height: 240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; padding: 16px; border-radius: 24px; background: #fff; box-shadow: 0 5px 0 #eadfc8; overflow: hidden; }
.say { display: inline-flex; align-items: center; gap: 6px; margin: 6px; padding: 10px 18px; border: 0; border-radius: 999px; background: #e3f2fd; box-shadow: 0 3px 0 #90caf9; font: inherit; font-size: 18px; font-weight: 900; color: #0d47a1; cursor: pointer; }
.say:active { transform: translateY(2px); }
.center { text-align: center; }
.card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; padding: 12px 14px; border: 0; border-radius: 20px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; cursor: pointer; }
.card:active { transform: translateY(3px); }
.quiz { display: grid; gap: 10px; margin-top: 12px; }
.quiz button { min-height: 60px; padding: 8px 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 #d6c39a; font: inherit; font-size: clamp(19px, 5vw, 24px); font-weight: 900; color: var(--ink); cursor: pointer; }
.quiz button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.quiz button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.fb { min-height: 1.6em; margin-top: 10px; text-align: center; font-size: 20px; font-weight: 900; color: #0e6b2e; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,250,240,.96); box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
.nav button { flex: 1; min-height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
#prev { background: #fff; box-shadow: 0 4px 0 #d7c3ad; color: var(--ink); }
#next { background: linear-gradient(180deg, #ffe38a, #ffc93c 55%, #e09a12); box-shadow: 0 4px 0 #9a6608; color: #3a2208; }
.nav button:disabled { opacity: .4; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
/* ===== 自訂樣式 ===== */
.clock { width: 210px; height: 210px; }
.clock .face { fill: #fff; stroke: #3f6fe0; stroke-width: 8; }
.clock .num { font: 900 20px system-ui, sans-serif; fill: #1a2b55; text-anchor: middle; dominant-baseline: central; }
.clock .hh, .clock .mh { stroke-linecap: round; transition: transform .8s ease-in-out; transform-origin: 100px 100px; }
.clock .hh { stroke: #1a2b55; stroke-width: 9; }
.clock .mh { stroke: #3f6fe0; stroke-width: 6; }
.spin .mh { animation: spinM 3s linear infinite; }
.spin .hh { animation: spinM 36s linear infinite; }
@keyframes spinM { to { transform: rotate(360deg); } }
.en { font-size: clamp(24px, 6vw, 32px); font-weight: 900; color: #3f6fe0; text-align: center; }
.zh { font-size: 18px; font-weight: 800; color: #6a5536; text-align: center; }
.times { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.times button { min-width: 92px; min-height: 52px; border: 0; border-radius: 16px; background: #eaf0ff; box-shadow: 0 4px 0 #a9bdf0; font: inherit; font-size: 22px; font-weight: 900; color: #1a2b55; cursor: pointer; }
.times button.on { background: #3f6fe0; color: #fff; }
.routine { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: 100%; }
.routine .card { min-width: 0; }
.routine .card span { font-size: 40px; }
.routine .card b { font-size: 18px; color: #1a2b55; }
.routine .card small { font-size: 15px; font-weight: 800; color: #6a5536; }
.sky { width: 100%; height: 70px; border-radius: 16px; position: relative; transition: background .8s; background: linear-gradient(#ffe9a8, #fff6d6); }
.sky .sun { position: absolute; top: 10px; font-size: 44px; transition: left .8s; left: 5%; }
.tl { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.tl .box { width: 120px; padding: 10px; border-radius: 18px; background: #eaf0ff; text-align: center; font-size: 18px; font-weight: 900; }
.tl .box span { display: block; font-size: 44px; }
.tl .box.hi { background: #3f6fe0; color: #fff; animation: pulse 1s ease-in-out 2; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.arrow { font-size: 34px; color: #3f6fe0; font-weight: 900; }
.word { font-size: 22px; font-weight: 900; color: #c62828; }
</style>
</head>
<body>
<main class="wrap">
  <div class="prog"></div>
  <section class="step" data-auto="What time is it? Let's learn to tell the time!" data-lang="en-US">
    <h1>⏰ What time is it?</h1>
    <div class="stage" style="flex-direction:column">
      <svg class="clock spin" viewBox="0 0 200 200" aria-label="時鐘"><circle class="face" cx="100" cy="100" r="92"/><g class="nums"></g><line class="hh" x1="100" y1="100" x2="100" y2="55"/><line class="mh" x1="100" y1="100" x2="100" y2="30"/><circle cx="100" cy="100" r="7" fill="#1a2b55"/></svg>
      <div class="en">What time is it?</div>
      <div class="zh">現在幾點？</div>
    </div>
    <p class="center"><button class="say" data-say="What time is it?" data-lang="en-US">🔊 What time is it?</button><button class="say" data-say="It is seven o'clock." data-lang="en-US">🔊 It is seven o'clock.</button></p>
  </section>

  <section class="step" data-auto="Tap a time. Listen and say it." data-lang="en-US">
    <h1>🕖 o'clock 和 thirty</h1>
    <div class="stage" style="flex-direction:column">
      <svg class="clock" id="clk" viewBox="0 0 200 200" aria-label="時鐘"><circle class="face" cx="100" cy="100" r="92"/><g class="nums"></g><line class="hh" id="hh" x1="100" y1="100" x2="100" y2="55"/><line class="mh" id="mh" x1="100" y1="100" x2="100" y2="30"/><circle cx="100" cy="100" r="7" fill="#1a2b55"/></svg>
      <div class="en" id="tEn">It is seven o'clock.</div>
      <div class="zh" id="tZh">現在七點。</div>
      <div class="times" id="times"></div>
    </div>
    <p class="small">長針指著 12 → o'clock（整點）；長針指著 6 → thirty（半）。</p>
  </section>

  <section class="step" data-auto="My day. Tap and listen." data-lang="en-US">
    <h1>🌞 My day 我的一天</h1>
    <div class="stage" style="flex-direction:column">
      <div class="sky" id="sky"><span class="sun" id="sun">🌅</span></div>
      <div class="routine" id="routine"></div>
    </div>
  </section>

  <section class="step" data-auto="before 是在什麼之前，after 是在什麼之後。點按鈕看看。">
    <h1>⬅️ before 和 after ➡️</h1>
    <div class="stage" style="flex-direction:column">
      <div class="tl"><div class="box" id="b1"><span id="b1i">🏫</span><i id="b1t">school</i></div><span class="arrow">➡️</span><div class="box" id="b2"><span id="b2i">✏️</span><i id="b2t">homework</i></div></div>
      <div class="en" id="baEn">&nbsp;</div>
      <div class="zh" id="baZh">&nbsp;</div>
      <p class="center"><button class="say" id="btnAfter">✏️ after school</button><button class="say" id="btnBefore">🪥 before bed</button></p>
    </div>
    <p class="small"><span class="word">before</span> 在……之前　　<span class="word">after</span> 在……之後</p>
  </section>

  <section class="step" data-auto="Look at the clock. What time is it?" data-lang="en-US">
    <h1>✏️ Quiz 1</h1>
    <div class="center"><svg class="clock" viewBox="0 0 200 200" aria-label="時鐘 8 點半"><circle class="face" cx="100" cy="100" r="92"/><g class="nums"></g><line class="hh" x1="100" y1="100" x2="100" y2="55" style="transform:rotate(255deg)"/><line class="mh" x1="100" y1="100" x2="100" y2="30" style="transform:rotate(180deg)"/><circle cx="100" cy="100" r="7" fill="#1a2b55"/></svg></div>
    <div class="quiz" data-why="長針指著 6 是「半」，短針在 8 和 9 中間，是八點半：It is eight thirty.">
      <button>It is eight o'clock.</button>
      <button data-right>It is eight thirty.</button>
      <button>It is six forty.</button>
    </div>
    <div class="fb"></div>
  </section>

  <section class="step" data-auto="I brush my teeth, blank, bed. Before or after?" data-lang="en-US">
    <h1>✏️ Quiz 2</h1>
    <p class="big">🪥 I brush my teeth ____ bed.<br><span class="small">（睡覺前刷牙）</span></p>
    <div class="quiz" data-why="睡覺「之前」刷牙，之前是 before：I brush my teeth before bed.">
      <button data-right>before</button>
      <button>after</button>
      <button>at</button>
    </div>
    <div class="fb"></div>
  </section>
</main>
<script>
[].forEach.call(document.querySelectorAll('.nums'), function (g) {
  var s = '';
  for (var n = 1; n <= 12; n++) { var a = n * Math.PI / 6; s += '<text class="num" x="' + (100 + 72 * Math.sin(a)).toFixed(1) + '" y="' + (100 - 72 * Math.cos(a)).toFixed(1) + '">' + n + '</text>'; }
  g.innerHTML = s;
});
var WORD = { 6: 'six', 7: 'seven', 8: 'eight', 9: 'nine', 10: 'ten' }, ZH = { 6: '六', 7: '七', 8: '八', 9: '九', 10: '十' };
var TIMES = [[6, 30], [7, 0], [7, 30], [8, 0], [9, 0]];
var tb = document.getElementById('times');
TIMES.forEach(function (t) {
  var b = document.createElement('button'); b.textContent = t[0] + ':' + (t[1] ? '30' : '00');
  b.onclick = function () { setClock(t[0], t[1], b, true); };
  tb.appendChild(b);
});
function setClock(h, m, btn, speak) {
  document.getElementById('hh').style.transform = 'rotate(' + ((h % 12) * 30 + m * 0.5) + 'deg)';
  document.getElementById('mh').style.transform = 'rotate(' + (m * 6) + 'deg)';
  var en = 'It is ' + WORD[h] + (m ? ' thirty.' : " o'clock.");
  document.getElementById('tEn').textContent = en;
  document.getElementById('tZh').textContent = '現在' + ZH[h] + '點' + (m ? '半' : '') + '。';
  [].forEach.call(tb.children, function (x) { x.classList.toggle('on', x === btn); });
  if (speak) say(en, 'en-US');
}
var R = [
  ['⏰', 'get up', '起床', 8, '🌅', 'I get up.'],
  ['🍳', 'eat breakfast', '吃早餐', 18, '🌅', 'I eat breakfast.'],
  ['🏫', 'go to school', '去上學', 30, '☀️', 'I go to school.'],
  ['😴', 'take a nap', '睡午覺', 45, '☀️', 'I take a nap after lunch.'],
  ['✏️', 'do my homework', '寫功課', 60, '🌇', 'I do my homework.'],
  ['🛁', 'take a bath', '洗澡', 72, '🌙', 'I take a bath.'],
  ['🪥', 'brush my teeth', '刷牙', 80, '🌙', 'I brush my teeth.'],
  ['🛏️', 'go to bed', '去睡覺', 88, '🌙', 'I go to bed.']
];
var rt = document.getElementById('routine');
R.forEach(function (r) {
  var b = document.createElement('button'); b.className = 'card';
  b.innerHTML = '<span>' + r[0] + '</span><b>' + r[1] + '</b><small>' + r[2] + '</small>';
  b.onclick = function () {
    say(r[5], 'en-US');
    var sun = document.getElementById('sun'); sun.textContent = r[4]; sun.style.left = r[3] + '%';
    document.getElementById('sky').style.background = r[4] === '🌙' ? 'linear-gradient(#1f2a5a, #3b4a8a)' : r[4] === '🌇' ? 'linear-gradient(#ffb37a, #ffe0b8)' : 'linear-gradient(#ffe9a8, #fff6d6)';
  };
  rt.appendChild(b);
});
function ba(i1, t1, i2, t2, hi, en, zh) {
  document.getElementById('b1i').textContent = i1; document.getElementById('b1t').textContent = t1;
  document.getElementById('b2i').textContent = i2; document.getElementById('b2t').textContent = t2;
  ['b1', 'b2'].forEach(function (id) { var e = document.getElementById(id); e.classList.remove('hi'); void e.offsetWidth; if (id === hi) e.classList.add('hi'); });
  document.getElementById('baEn').textContent = en; document.getElementById('baZh').textContent = zh;
  say(en, 'en-US');
}
document.getElementById('btnAfter').onclick = function () { ba('🏫', 'school', '✏️', 'homework', 'b2', 'I do my homework after school.', '放學「之後」寫功課。'); };
document.getElementById('btnBefore').onclick = function () { ba('🪥', 'brush teeth', '🛏️', 'bed', 'b1', 'I brush my teeth before bed.', '睡覺「之前」刷牙。'); };
window.onStep = function (i) {
  if (i === 1) setClock(7, 0, tb.children[1], false);
};
</script>
<nav class="nav"><button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button></nav>
<script>
/* ===== 共用程式（不要改） ===== */
function pickVoice(lang, want) {
  var BAD = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|fred|good news|hysterical|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|eloquence/i;
  var GOOD = ['samantha', 'ava', 'allison', 'susan', 'zoe', 'nicky', 'joelle', 'evan', 'nathan', 'tom', 'aaron', 'google us english', 'microsoft aria', 'microsoft jenny', 'microsoft guy'];
  var all = speechSynthesis.getVoices(), best = null, bestScore = -1;
  for (var i = 0; i < all.length; i++) {
    var v = all[i], l = v.lang.replace('_', '-').toLowerCase();
    if (l.indexOf(lang.toLowerCase().slice(0, 2)) !== 0) continue;
    if (want && v.name === want) return v;
    if (BAD.test(v.name)) continue;
    var n = v.name.toLowerCase(), sc = l.indexOf(lang.toLowerCase()) === 0 ? 5 : 0;
    if (/premium/.test(n)) sc += 30;
    if (/enhanced|neural|natural/.test(n)) sc += 20;
    for (var g = 0; g < GOOD.length; g++) if (n.indexOf(GOOD[g]) >= 0) { sc += 15 - g * 0.5; break; }
    if (sc > bestScore) { best = v; bestScore = sc; }
  }
  return best;
}
function say(t, lang, rate) {
  try {
    speechSynthesis.cancel();
    var P = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) P[p[0]] = decodeURIComponent(p[1] || ''); });
    var u = new SpeechSynthesisUtterance(t);
    u.lang = lang || 'zh-TW';
    var en = u.lang.indexOf('en') === 0;
    u.rate = rate || (en ? (parseFloat(P.rate) || 0.75) : 0.9);
    var v = pickVoice(u.lang, en ? P.voice : '');
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
var steps = [].slice.call(document.querySelectorAll('.step')), cur = 0, prog = document.querySelector('.prog');
steps.forEach(function () { prog.appendChild(document.createElement('i')); });
function go(n) {
  cur = Math.max(0, Math.min(steps.length - 1, n));
  steps.forEach(function (s, i) { s.classList.toggle('on', i === cur); });
  [].forEach.call(prog.children, function (d, i) { d.classList.toggle('on', i <= cur); });
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = cur === steps.length - 1 ? '🎉 學完了' : '下一步 ▶';
  window.scrollTo(0, 0);
  var s = steps[cur];
  if (s.dataset.auto) say(s.dataset.auto, s.dataset.lang);
  if (window.onStep) window.onStep(cur, s);
}
document.getElementById('prev').onclick = function () { go(cur - 1); };
document.getElementById('next').onclick = function () {
  if (cur < steps.length - 1) return go(cur + 1);
  document.querySelector('.wrap').innerHTML = '<h1 style="margin-top:40px">🎉 學完了！</h1><p class="big">Ivan勇士好棒！<br>按左上角的 ✕ 回到今日任務。</p><p class="center" style="font-size:90px">🏆</p>';
  document.querySelector('.nav').remove();
  say('學完了！Ivan勇士好棒！');
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) say(b.dataset.say, b.dataset.lang); });
[].forEach.call(document.querySelectorAll('.quiz'), function (q) {
  q.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || q.dataset.done) return;
    var fb = q.parentNode.querySelector('.fb'), ok = b.hasAttribute('data-right');
    b.classList.add(ok ? 'right' : 'wrong');
    if (ok) { q.dataset.done = 1; fb.style.color = '#0e6b2e'; fb.textContent = '🎉 答對了！' + (q.dataset.why || ''); say('答對了！' + (q.dataset.why || '')); }
    else { fb.style.color = '#a0161b'; fb.textContent = '再想想看！'; say('再想想看'); }
  });
});
go(0);
</script>
</body>
</html>
