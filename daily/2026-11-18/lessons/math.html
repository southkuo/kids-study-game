<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乘法填空和比大小</title>
<!--
  教學老師的教材範本（每天複製這個檔案到 daily/日期/lessons/科目.html 再改內容）
  規則：
  - 一個檔案就是一個完整教材，CSS、JS、圖都寫在裡面，不能載入任何外部網址。
  - 每一個 <section class="step"> 是一頁，下方會自動出現「上一步／下一步」和進度點。
  - data-auto="要念的話"：進到這一頁時自動朗讀（data-lang="en-US" 用英文念）。
  - 任何元素加上 data-say="要念的話"（可加 data-lang="en-US"），點了就會念。
  - 小測驗：<div class="quiz" data-why="答對時的補充說明"> 裡面放按鈕，正確的按鈕加 data-right，後面放 <div class="fb"></div>。
  - 需要每頁自己的動畫：寫 window.onStep = function (index, section) { … }，換頁時會呼叫。
  - 只改「教材內容」區塊和自訂樣式；下面的共用程式不要改壞。
-->
<style>
:root { --c: #2f8fd8; --ink: #2b2112; --bg: #fffaf0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
.prog { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.prog i { width: 14px; height: 14px; border-radius: 50%; background: #e0d6c3; }
.prog i.on { background: var(--c); }
.step { display: none; }
.step.on { display: block; animation: stepIn .45s ease-out; }
@keyframes stepIn { from { opacity: 0; transform: translateY(18px); } }
h1 { margin: 6px 0 10px; font-size: clamp(26px, 6.5vw, 38px); text-align: center; color: var(--c); }
.big { font-size: clamp(21px, 5.4vw, 29px); font-weight: 900; line-height: 1.55; text-align: center; margin: 8px 0; }
.small { font-size: 17px; font-weight: 700; text-align: center; color: #6a5536; }
.stage { position: relative; min-height: 240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; padding: 16px; border-radius: 24px; background: #fff; box-shadow: 0 5px 0 #eadfc8; overflow: hidden; }
.say { display: inline-flex; align-items: center; gap: 6px; margin: 6px; padding: 10px 18px; border: 0; border-radius: 999px; background: #e3f2fd; box-shadow: 0 3px 0 #90caf9; font: inherit; font-size: 18px; font-weight: 900; color: #0d47a1; cursor: pointer; }
.say:active { transform: translateY(2px); }
.center { text-align: center; }
.card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; padding: 12px 14px; border: 0; border-radius: 20px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; cursor: pointer; }
.card:active { transform: translateY(3px); }
.quiz { display: grid; gap: 10px; margin-top: 12px; }
.quiz button { min-height: 60px; padding: 8px 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 #d6c39a; font: inherit; font-size: clamp(19px, 5vw, 24px); font-weight: 900; color: var(--ink); cursor: pointer; }
.quiz button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.quiz button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.fb { min-height: 1.6em; margin-top: 10px; text-align: center; font-size: 20px; font-weight: 900; color: #0e6b2e; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,250,240,.96); box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
.nav button { flex: 1; min-height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
#prev { background: #fff; box-shadow: 0 4px 0 #d7c3ad; color: var(--ink); }
#next { background: linear-gradient(180deg, #ffe38a, #ffc93c 55%, #e09a12); box-shadow: 0 4px 0 #9a6608; color: #3a2208; }
.nav button:disabled { opacity: .4; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
/* ===== 自訂樣式（這一份教材自己的動畫）寫在這裡 ===== */
.eqbig { font-size: clamp(40px, 11vw, 64px); font-weight: 900; color: #2f8fd8; display: flex; align-items: center; gap: 10px; }
.box { display: inline-flex; align-items: center; justify-content: center; width: 1.3em; height: 1.3em; border: 5px dashed #ff9f1c; border-radius: 14px; color: #ff9f1c; animation: wob 1.4s ease-in-out infinite; }
@keyframes wob { 25% { transform: rotate(-8deg) scale(1.08); } 75% { transform: rotate(8deg) scale(1.08); } }
.groups { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; }
.grp { padding: 6px 8px; border-radius: 12px; background: #e6f3fc; font-size: 26px; animation: drop .5s ease-out backwards; }
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } }
.pick { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 6px 0; }
.pick button, .ctrl button { min-height: 56px; padding: 6px 16px; border: 0; border-radius: 999px; background: #e6f3fc; box-shadow: 0 3px 0 #8cc4ec; font: inherit; font-size: 21px; font-weight: 900; color: #1b5d93; cursor: pointer; }
.pick button.sel { background: #2f8fd8; color: #fff; }
.ctrl { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.ctrl button:disabled { opacity: .4; }
.chants { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
.chants div { font-size: 22px; font-weight: 900; padding: 4px 14px; border-radius: 12px; animation: drop .4s ease-out; }
.chants div.hit { background: #ffe38a; box-shadow: 0 0 0 3px #ff9f1c; font-size: 26px; }
.prob { font-size: clamp(30px, 8vw, 44px); font-weight: 900; text-align: center; color: #2f8fd8; }
.signs { display: grid; gap: 10px; width: 100%; }
.signs button { display: flex; align-items: center; justify-content: center; gap: 16px; min-height: 70px; border: 0; border-radius: 18px; background: #f2f8fd; box-shadow: 0 4px 0 #b9dcf5; font: inherit; font-size: 36px; font-weight: 900; color: var(--ink); cursor: pointer; }
.signs .s { color: #e5484d; font-size: 46px; }
.cmp { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; flex-wrap: wrap; }
.side { min-width: 120px; padding: 10px; border-radius: 18px; background: #e6f3fc; text-align: center; font-size: 30px; font-weight: 900; }
.side .r { display: block; min-height: 1.3em; color: #2f8fd8; font-size: 34px; }
.side .r.show { animation: drop .4s ease-out; }
.mid { width: 70px; height: 70px; border-radius: 50%; background: #fff3d6; display: flex; align-items: center; justify-content: center; font-size: 46px; font-weight: 900; color: #e5484d; }
.mid.show { animation: wob .6s ease-in-out 2; }

</style>
</head>
<body>
<main class="wrap">
  <div class="prog"></div>

  <!-- ===== 教材內容 ===== -->
  <section class="step" data-auto="三乘以多少等於十二？方框裡藏著一個數，我們用口訣把它找出來！">
    <h1>🔎 方框裡是多少？</h1>
    <div class="stage" style="flex-direction:column">
      <div class="eqbig">3 × <span class="box">?</span> = 12</div>
      <div class="groups" id="g1"></div>
    </div>
    <p class="big">用口訣，把 □ 找出來！</p>
    <p class="center"><button class="say" data-say="三乘以多少等於十二？方框裡藏著一個數，我們用口訣把它找出來！">🔊 聽一聽</button></p>
  </section>

  <section class="step" data-auto="先選一題。再按念下一句，一句一句念口訣，念到答案就找到了！">
    <h1>🎵 一句一句念口訣</h1>
    <div class="pick" id="fillPick">
      <button data-a="4" data-t="20">4 × □ = 20</button>
      <button data-a="7" data-t="42">7 × □ = 42</button>
      <button data-a="8" data-t="72">8 × □ = 72</button>
    </div>
    <p class="prob" id="fillProb"></p>
    <div class="stage" style="min-height:180px"><div class="chants" id="chants"></div></div>
    <div class="ctrl"><button id="nextChant">🎵 念下一句</button><button id="resetChant">🔄 重來</button></div>
  </section>

  <section class="step" data-auto="比大小的符號，開口朝向大的數，尖尖的那邊朝向小的數。一樣大就用等號。點點看。">
    <h1>🐊 大於、小於、等於</h1>
    <div class="stage">
      <div class="signs">
        <button data-say="九大於五。開口朝向大的九。">9 <span class="s">&gt;</span> 5 <small style="font-size:20px">大於</small></button>
        <button data-say="五小於九。開口還是朝向大的九。">5 <span class="s">&lt;</span> 9 <small style="font-size:20px">小於</small></button>
        <button data-say="七等於七。兩邊一樣大。">7 <span class="s">=</span> 7 <small style="font-size:20px">等於</small></button>
      </div>
    </div>
    <p class="big">開口朝向<b>大</b>的數，<br>尖尖朝向<b>小</b>的數。</p>
  </section>

  <section class="step" data-auto="乘法比大小：先算左邊，再算右邊，最後比一比。選一題試試看。">
    <h1>⚖️ 乘法比大小</h1>
    <div class="pick" id="cmpPick">
      <button data-l="5,6" data-r="4,8">5 × 6 ○ 4 × 8</button>
      <button data-l="2,9" data-r="3,6">2 × 9 ○ 3 × 6</button>
      <button data-l="7,7" data-r="6,8">7 × 7 ○ 6 × 8</button>
    </div>
    <div class="stage" style="min-height:160px">
      <div class="cmp">
        <div class="side"><span id="lq"></span><span class="r" id="lr"></span></div>
        <div class="mid" id="mid">○</div>
        <div class="side"><span id="rq"></span><span class="r" id="rr"></span></div>
      </div>
    </div>
    <div class="ctrl"><button id="calcL">① 算左邊</button><button id="calcR">② 算右邊</button><button id="calcC">③ 比一比</button></div>
  </section>

  <section class="step" data-auto="小測驗！六乘以多少等於四十二？">
    <h1>✏️ 小測驗 1</h1>
    <p class="prob" style="font-size:44px">6 × □ = 42</p>
    <p class="small">提示：念 6 的口訣，念到 42 就停。</p>
    <div class="quiz" data-why="六七四十二，6 × 7 = 42，所以 □ 裡是 7。">
      <button>6</button><button data-right>7</button><button>8</button>
    </div>
    <div class="fb"></div>
  </section>

  <section class="step" data-auto="小測驗！四乘以九，和五乘以七，圓圈裡要放什麼？">
    <h1>✏️ 小測驗 2</h1>
    <p class="prob" style="font-size:40px">4 × 9 ○ 5 × 7</p>
    <p class="small">提示：先算兩邊，再比一比。</p>
    <div class="quiz" data-why="四九三十六，五七三十五。36 比 35 大，開口朝向左邊，所以用 >。">
      <button data-right>&gt;</button><button>&lt;</button><button>=</button>
    </div>
    <div class="fb"></div>
  </section>

  <!-- ===== 教材內容結束 ===== -->
</main>
<script>
var D = '零一二三四五六七八九';
function zhNum(p) { if (p < 10) return D[p]; if (p === 10) return '十'; if (p < 20) return '十' + D[p - 10]; var t = Math.floor(p / 10), o = p % 10; return D[t] + '十' + (o ? D[o] : ''); }
function chant(a, b) { var p = a * b; return D[a] + D[b] + (p < 10 ? '得' + D[p] : p === 10 ? '一十' : zhNum(p)); }

// 第 1 頁：3 個一組的點點
function drawG1() {
  var g = document.getElementById('g1'); g.innerHTML = '';
  for (var i = 0; i < 4; i++) { var d = document.createElement('span'); d.className = 'grp'; d.textContent = '🍬🍬🍬'; d.style.animationDelay = (i * 0.4 + 0.3) + 's'; g.appendChild(d); }
}

// 第 2 頁：一句一句念口訣
var fa = 4, ft = 20, fb = 0;
function setFill(btn) {
  fa = +btn.dataset.a; ft = +btn.dataset.t; fb = 0;
  [].forEach.call(document.querySelectorAll('#fillPick button'), function (x) { x.classList.toggle('sel', x === btn); });
  document.getElementById('fillProb').textContent = fa + ' × □ = ' + ft;
  document.getElementById('chants').innerHTML = '';
  document.getElementById('nextChant').disabled = false;
}
document.getElementById('fillPick').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  setFill(b); say(zhNum(fa) + '乘以多少等於' + zhNum(ft) + '？念' + zhNum(fa) + '的口訣。');
});
document.getElementById('nextChant').onclick = function () {
  if (fb >= 9) return;
  fb++;
  var p = fa * fb, row = document.createElement('div');
  row.textContent = chant(fa, fb) + '　' + fa + ' × ' + fb + ' = ' + p;
  document.getElementById('chants').appendChild(row);
  if (p === ft) {
    row.classList.add('hit'); row.textContent += '　✅';
    document.getElementById('nextChant').disabled = true;
    say(chant(fa, fb) + '！找到了，方框裡是' + zhNum(fb) + '。');
  } else say(chant(fa, fb));
};
document.getElementById('resetChant').onclick = function () { setFill(document.querySelector('#fillPick .sel') || document.querySelector('#fillPick button')); };

// 第 4 頁：乘法比大小
var L = [5, 6], R = [4, 8];
function setCmp(btn) {
  L = btn.dataset.l.split(',').map(Number); R = btn.dataset.r.split(',').map(Number);
  [].forEach.call(document.querySelectorAll('#cmpPick button'), function (x) { x.classList.toggle('sel', x === btn); });
  document.getElementById('lq').textContent = L[0] + ' × ' + L[1];
  document.getElementById('rq').textContent = R[0] + ' × ' + R[1];
  ['lr', 'rr'].forEach(function (id) { var r = document.getElementById(id); r.textContent = ''; r.classList.remove('show'); });
  var m = document.getElementById('mid'); m.textContent = '○'; m.classList.remove('show');
}
document.getElementById('cmpPick').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setCmp(b); });
function show(id, q) {
  var r = document.getElementById(id); r.textContent = q[0] * q[1]; r.classList.remove('show'); void r.offsetWidth; r.classList.add('show');
  say(chant(q[0], q[1]) + '，' + zhNum(q[0]) + '乘以' + zhNum(q[1]) + '等於' + zhNum(q[0] * q[1]));
}
document.getElementById('calcL').onclick = function () { show('lr', L); };
document.getElementById('calcR').onclick = function () { show('rr', R); };
document.getElementById('calcC').onclick = function () {
  var a = L[0] * L[1], b = R[0] * R[1], m = document.getElementById('mid');
  document.getElementById('lr').textContent = a; document.getElementById('rr').textContent = b;
  m.textContent = a > b ? '>' : a < b ? '<' : '=';
  m.classList.remove('show'); void m.offsetWidth; m.classList.add('show');
  say(a > b ? zhNum(a) + '比' + zhNum(b) + '大，用大於。' : a < b ? zhNum(a) + '比' + zhNum(b) + '小，用小於。' : '兩邊都是' + zhNum(a) + '，一樣大，用等於。');
};

window.onStep = function (i) {
  if (i === 0) drawG1();
  if (i === 1) setFill(document.querySelector('#fillPick .sel') || document.querySelector('#fillPick button'));
  if (i === 3) setCmp(document.querySelector('#cmpPick .sel') || document.querySelector('#cmpPick button'));
};

</script>
<nav class="nav"><button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button></nav>
<script>
/* ===== 共用程式（不要改） ===== */
function pickVoice(lang, want) {
  var BAD = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|fred|good news|hysterical|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|eloquence/i;
  var GOOD = ['samantha', 'ava', 'allison', 'susan', 'zoe', 'nicky', 'joelle', 'evan', 'nathan', 'tom', 'aaron', 'google us english', 'microsoft aria', 'microsoft jenny', 'microsoft guy'];
  var all = speechSynthesis.getVoices(), best = null, bestScore = -1;
  for (var i = 0; i < all.length; i++) {
    var v = all[i], l = v.lang.replace('_', '-').toLowerCase();
    if (l.indexOf(lang.toLowerCase().slice(0, 2)) !== 0) continue;
    if (want && v.name === want) return v;
    if (BAD.test(v.name)) continue;
    var n = v.name.toLowerCase(), sc = l.indexOf(lang.toLowerCase()) === 0 ? 5 : 0;
    if (/premium/.test(n)) sc += 30;
    if (/enhanced|neural|natural/.test(n)) sc += 20;
    for (var g = 0; g < GOOD.length; g++) if (n.indexOf(GOOD[g]) >= 0) { sc += 15 - g * 0.5; break; }
    if (sc > bestScore) { best = v; bestScore = sc; }
  }
  return best;
}
function say(t, lang, rate) {
  try {
    speechSynthesis.cancel();
    var P = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) P[p[0]] = decodeURIComponent(p[1] || ''); });
    var u = new SpeechSynthesisUtterance(t);
    u.lang = lang || 'zh-TW';
    var en = u.lang.indexOf('en') === 0;
    u.rate = rate || (en ? (parseFloat(P.rate) || 0.75) : 0.9);
    var v = pickVoice(u.lang, en ? P.voice : '');
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
var steps = [].slice.call(document.querySelectorAll('.step')), cur = 0, prog = document.querySelector('.prog');
steps.forEach(function () { prog.appendChild(document.createElement('i')); });
function go(n) {
  cur = Math.max(0, Math.min(steps.length - 1, n));
  steps.forEach(function (s, i) { s.classList.toggle('on', i === cur); });
  [].forEach.call(prog.children, function (d, i) { d.classList.toggle('on', i <= cur); });
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = cur === steps.length - 1 ? '🎉 學完了' : '下一步 ▶';
  window.scrollTo(0, 0);
  var s = steps[cur];
  if (s.dataset.auto) say(s.dataset.auto, s.dataset.lang);
  if (window.onStep) window.onStep(cur, s);
}
document.getElementById('prev').onclick = function () { go(cur - 1); };
document.getElementById('next').onclick = function () {
  if (cur < steps.length - 1) return go(cur + 1);
  document.querySelector('.wrap').innerHTML = '<h1 style="margin-top:40px">🎉 學完了！</h1><p class="big">Ivan勇士好棒！<br>按左上角的 ✕ 回到今日任務。</p><p class="center" style="font-size:90px">🏆</p>';
  document.querySelector('.nav').remove();
  say('學完了！Ivan勇士好棒！');
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) say(b.dataset.say, b.dataset.lang); });
[].forEach.call(document.querySelectorAll('.quiz'), function (q) {
  q.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || q.dataset.done) return;
    var fb = q.parentNode.querySelector('.fb'), ok = b.hasAttribute('data-right');
    b.classList.add(ok ? 'right' : 'wrong');
    if (ok) { q.dataset.done = 1; fb.style.color = '#0e6b2e'; fb.textContent = '🎉 答對了！' + (q.dataset.why || ''); say('答對了！' + (q.dataset.why || '')); }
    else { fb.style.color = '#a0161b'; fb.textContent = '再想想看！'; say('再想想看'); }
  });
});
go(0);
</script>
</body>
</html>
