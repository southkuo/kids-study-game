<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let's Go! Transportation</title>
<!--
  教學老師的教材範本（每天複製這個檔案到 daily/日期/lessons/科目.html 再改內容）
  規則：
  - 一個檔案就是一個完整教材，CSS、JS、圖都寫在裡面，不能載入任何外部網址。
  - 每一個 <section class="step"> 是一頁，下方會自動出現「上一步／下一步」和進度點。
  - data-auto="要念的話"：進到這一頁時自動朗讀（data-lang="en-US" 用英文念）。
  - 任何元素加上 data-say="要念的話"（可加 data-lang="en-US"），點了就會念。
  - 小測驗：<div class="quiz" data-why="答對時的補充說明"> 裡面放按鈕，正確的按鈕加 data-right，後面放 <div class="fb"></div>。
  - 需要每頁自己的動畫：寫 window.onStep = function (index, section) { … }，換頁時會呼叫。
  - 只改「教材內容」區塊和自訂樣式；下面的共用程式不要改壞。
-->
<style>
:root { --c: #3f6fe0; --ink: #2b2112; --bg: #fffaf0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
.prog { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.prog i { width: 14px; height: 14px; border-radius: 50%; background: #e0d6c3; }
.prog i.on { background: var(--c); }
.step { display: none; }
.step.on { display: block; animation: stepIn .45s ease-out; }
@keyframes stepIn { from { opacity: 0; transform: translateY(18px); } }
h1 { margin: 6px 0 10px; font-size: clamp(26px, 6.5vw, 38px); text-align: center; color: var(--c); }
.big { font-size: clamp(21px, 5.4vw, 29px); font-weight: 900; line-height: 1.55; text-align: center; margin: 8px 0; }
.small { font-size: 17px; font-weight: 700; text-align: center; color: #6a5536; }
.stage { position: relative; min-height: 240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; padding: 16px; border-radius: 24px; background: #fff; box-shadow: 0 5px 0 #eadfc8; overflow: hidden; }
.say { display: inline-flex; align-items: center; gap: 6px; margin: 6px; padding: 10px 18px; border: 0; border-radius: 999px; background: #e3f2fd; box-shadow: 0 3px 0 #90caf9; font: inherit; font-size: 18px; font-weight: 900; color: #0d47a1; cursor: pointer; }
.say:active { transform: translateY(2px); }
.center { text-align: center; }
.card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; padding: 12px 14px; border: 0; border-radius: 20px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; cursor: pointer; }
.card:active { transform: translateY(3px); }
.quiz { display: grid; gap: 10px; margin-top: 12px; }
.quiz button { min-height: 60px; padding: 8px 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 #d6c39a; font: inherit; font-size: clamp(19px, 5vw, 24px); font-weight: 900; color: var(--ink); cursor: pointer; }
.quiz button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.quiz button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.fb { min-height: 1.6em; margin-top: 10px; text-align: center; font-size: 20px; font-weight: 900; color: #0e6b2e; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,250,240,.96); box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
.nav button { flex: 1; min-height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
#prev { background: #fff; box-shadow: 0 4px 0 #d7c3ad; color: var(--ink); }
#next { background: linear-gradient(180deg, #ffe38a, #ffc93c 55%, #e09a12); box-shadow: 0 4px 0 #9a6608; color: #3a2208; }
.nav button:disabled { opacity: .4; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
/* ===== 自訂樣式（這一份教材自己的動畫）寫在這裡 ===== */
.road { position: relative; width: 100%; height: 200px; background: linear-gradient(#bfe7ff 0 55%, #7c8a96 55% 100%); border-radius: 18px; overflow: hidden; }
.road::after { content: ""; position: absolute; left: 0; right: 0; top: 77%; height: 6px; background: repeating-linear-gradient(90deg, #fff 0 30px, transparent 30px 60px); }
.road .v { position: absolute; font-size: 54px; transform: scaleX(-1); animation: drive 6s linear infinite; }
.road .v.l1 { top: 98px; } .road .v.l2 { top: 140px; }
.road .v.sky { top: 6px; animation-duration: 8s; transform: none; }
@keyframes drive { from { left: -80px; } to { left: 105%; } }
.en { font-size: clamp(24px, 6vw, 34px); font-weight: 900; text-align: center; color: #3f6fe0; margin: 6px 0; }
.zh { font-size: 18px; font-weight: 700; text-align: center; color: #6a5536; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; width: 100%; }
.card .e { font-size: 54px; }
.card .w { font-size: 22px; font-weight: 900; color: #3f6fe0; }
.card .c { font-size: 16px; color: #6a5536; }
.card.lit { animation: bounce .5s; box-shadow: 0 4px 0 #3f6fe0; }
@keyframes bounce { 40% { transform: scale(1.12); } }
.trip { position: relative; width: 100%; height: 110px; background: #e9f6e3; border-radius: 18px; overflow: hidden; }
.trip .home, .trip .school { position: absolute; top: 22px; font-size: 54px; }
.trip .home { left: 8px; } .trip .school { right: 8px; }
.trip #mover { position: absolute; top: 36px; left: 70px; font-size: 44px; transform: scaleX(-1); }
.trip #mover.go { transition: left 2.2s ease-in-out; left: calc(100% - 120px); }
.opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.opts button { min-height: 56px; padding: 6px 16px; border: 0; border-radius: 999px; background: #e8eefc; box-shadow: 0 3px 0 #9fb5ef; font: inherit; font-size: 20px; font-weight: 900; color: #23408a; cursor: pointer; }
.race { position: relative; width: 100%; height: 150px; background: #f0f4ff; border-radius: 18px; overflow: hidden; }
.lane { position: absolute; left: 0; right: 0; height: 50%; border-bottom: 3px dashed #c5d2f3; }
.lane:nth-child(2) { top: 50%; }
.racer { position: absolute; left: 6px; top: 12px; font-size: 46px; transform: scaleX(-1); }
.flag { position: absolute; right: 8px; top: 40px; font-size: 50px; }

</style>
</head>
<body>
<main class="wrap">
  <div class="prog"></div>

  <!-- ===== 教材內容 ===== -->
  <section class="step" data-auto="Let's go! Cars, buses, and planes. Transportation." data-lang="en-US">
    <h1>🚦 Let's Go!</h1>
    <div class="stage" style="padding:8px">
      <div class="road">
        <span class="v sky">✈️</span>
        <span class="v l1">🚌</span>
        <span class="v l1" style="animation-delay:-3s">🚗</span>
        <span class="v l2" style="animation-delay:-1.5s;animation-duration:9s">🚲</span>
        <span class="v l2" style="animation-delay:-5s;animation-duration:7s">🛵</span>
      </div>
    </div>
    <p class="en">Transportation</p>
    <p class="zh">交通工具：載我們去各個地方</p>
    <p class="center"><button class="say" data-say="Transportation" data-lang="en-US">🔊 Transportation</button></p>
  </section>

  <section class="step" data-auto="Tap a card and listen." data-lang="en-US">
    <h1>🎴 Tap and Listen</h1>
    <div class="stage">
      <div class="grid" id="vgrid">
        <button class="card" data-say="car. I can see a car." data-lang="en-US"><span class="e">🚗</span><span class="w">car</span><span class="c">汽車</span></button>
        <button class="card" data-say="bus. I can see a bus." data-lang="en-US"><span class="e">🚌</span><span class="w">bus</span><span class="c">公車</span></button>
        <button class="card" data-say="scooter. I can see a scooter." data-lang="en-US"><span class="e">🛵</span><span class="w">scooter</span><span class="c">機車</span></button>
        <button class="card" data-say="bike. I can see a bike." data-lang="en-US"><span class="e">🚲</span><span class="w">bike</span><span class="c">腳踏車</span></button>
        <button class="card" data-say="truck. I can see a truck." data-lang="en-US"><span class="e">🚚</span><span class="w">truck</span><span class="c">卡車</span></button>
        <button class="card" data-say="train. I can see a train." data-lang="en-US"><span class="e">🚆</span><span class="w">train</span><span class="c">火車</span></button>
        <button class="card" data-say="plane. I can see a plane." data-lang="en-US"><span class="e">✈️</span><span class="w">plane</span><span class="c">飛機</span></button>
        <button class="card" data-say="boat. I can see a boat." data-lang="en-US"><span class="e">⛵</span><span class="w">boat</span><span class="c">船</span></button>
      </div>
    </div>
  </section>

  <section class="step" data-auto="How do you go to school? Pick one!" data-lang="en-US">
    <h1>🏫 How do you go to school?</h1>
    <div class="stage" style="min-height:0">
      <div class="trip"><span class="home">🏠</span><span id="mover">🚌</span><span class="school">🏫</span></div>
    </div>
    <div class="opts" id="opts">
      <button data-v="🚌" data-s="I go to school by bus." data-z="我坐公車上學。">🚌 bus</button>
      <button data-v="🚗" data-s="I go to school by car." data-z="我坐汽車上學。">🚗 car</button>
      <button data-v="🛵" data-s="I go to school by scooter." data-z="我坐機車上學。">🛵 scooter</button>
      <button data-v="🚲" data-s="I go to school by bike." data-z="我騎腳踏車上學。">🚲 bike</button>
      <button data-v="🚶" data-s="I walk to school." data-z="我走路上學。">🚶 walk</button>
    </div>
    <p class="en" id="sent">I go to school by bus.</p>
    <p class="zh" id="sentZh">我坐公車上學。</p>
    <p class="small">💡 by + 交通工具；走路要說 <b>I walk to school.</b></p>
  </section>

  <section class="step" data-auto="Which is faster? Tap Go and watch the race!" data-lang="en-US">
    <h1>🏁 Which is faster?</h1>
    <div class="stage" style="min-height:0">
      <div class="race" id="race">
        <div class="lane"><span class="racer" id="r1">🚗</span></div>
        <div class="lane"><span class="racer" id="r2">🚲</span></div>
        <span class="flag">🏁</span>
      </div>
    </div>
    <div class="opts" id="pairs">
      <button data-a="🚗" data-b="🚲" data-s="A car is faster than a bike." data-z="汽車比腳踏車快。">🚗 vs 🚲</button>
      <button data-a="✈️" data-b="🚆" data-s="A plane is faster than a train." data-z="飛機比火車快。">✈️ vs 🚆</button>
      <button data-a="🚲" data-b="🚶" data-s="A bike is faster than walking." data-z="騎腳踏車比走路快。">🚲 vs 🚶</button>
    </div>
    <p class="center"><button class="say" id="goBtn" style="min-height:56px;font-size:22px">▶ Go!</button></p>
    <p class="en" id="fast">&nbsp;</p>
    <p class="zh" id="fastZh">&nbsp;</p>
  </section>

  <section class="step" data-auto="Quiz! I go to school by what?" data-lang="en-US">
    <h1>✏️ Quiz 1</h1>
    <div class="stage" style="min-height:0"><span style="font-size:80px">🏠 🚌 ➡️ 🏫</span></div>
    <p class="en">I go to school by ______.</p>
    <div class="quiz" data-why="圖上是公車，公車的英文是 bus：I go to school by bus.">
      <button>boat</button><button data-right>bus</button><button>plane</button>
    </div>
    <div class="fb"></div>
  </section>

  <section class="step" data-auto="Quiz! Which sentence is right?" data-lang="en-US">
    <h1>✏️ Quiz 2</h1>
    <div class="stage" style="min-height:0"><span style="font-size:70px">✈️ 💨 &nbsp; 🚲</span></div>
    <p class="big">哪一句是對的？</p>
    <div class="quiz" data-why="飛機飛得比腳踏車快很多，所以說 A plane is faster than a bike.">
      <button>A bike is faster than a plane.</button><button data-right>A plane is faster than a bike.</button>
    </div>
    <div class="fb"></div>
  </section>

  <!-- ===== 教材內容結束 ===== -->
</main>
<script>
document.getElementById('vgrid').addEventListener('click', function (e) {
  var c = e.target.closest('.card'); if (!c) return;
  c.classList.remove('lit'); void c.offsetWidth; c.classList.add('lit');
});
document.getElementById('opts').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var m = document.getElementById('mover');
  m.className = ''; m.textContent = b.dataset.v;
  void m.offsetWidth;
  setTimeout(function () { m.classList.add('go'); }, 30);
  document.getElementById('sent').textContent = b.dataset.s;
  document.getElementById('sentZh').textContent = b.dataset.z;
  say(b.dataset.s, 'en-US');
});
var pair = document.querySelector('#pairs button');
function setPair(b) {
  pair = b;
  [].forEach.call(document.querySelectorAll('#pairs button'), function (x) { x.style.background = x === b ? '#c9d8ff' : ''; });
  ['r1', 'r2'].forEach(function (id, i) {
    var r = document.getElementById(id);
    r.style.transition = 'none'; r.style.left = '6px';
    r.textContent = i ? b.dataset.b : b.dataset.a;
    r.style.transform = r.textContent === '✈️' ? 'none' : 'scaleX(-1)';
  });
  document.getElementById('fast').innerHTML = '&nbsp;';
  document.getElementById('fastZh').innerHTML = '&nbsp;';
}
document.getElementById('pairs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (b) setPair(b);
});
document.getElementById('goBtn').onclick = function () {
  var b = pair; setPair(b);
  var r1 = document.getElementById('r1'), r2 = document.getElementById('r2');
  void r1.offsetWidth;
  r1.style.transition = 'left 1.2s ease-in'; r2.style.transition = 'left 3.2s linear';
  r1.style.left = 'calc(100% - 110px)'; r2.style.left = 'calc(100% - 110px)';
  setTimeout(function () {
    document.getElementById('fast').textContent = b.dataset.s;
    document.getElementById('fastZh').textContent = b.dataset.z;
    say(b.dataset.s, 'en-US');
  }, 1300);
};
window.onStep = function (i) { if (i === 3) setPair(pair); };

</script>
<nav class="nav"><button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button></nav>
<script>
/* ===== 共用程式（不要改） ===== */
function pickVoice(lang, want) {
  var BAD = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|fred|good news|hysterical|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|eloquence/i;
  var GOOD = ['samantha', 'ava', 'allison', 'susan', 'zoe', 'nicky', 'joelle', 'evan', 'nathan', 'tom', 'aaron', 'google us english', 'microsoft aria', 'microsoft jenny', 'microsoft guy'];
  var all = speechSynthesis.getVoices(), best = null, bestScore = -1;
  for (var i = 0; i < all.length; i++) {
    var v = all[i], l = v.lang.replace('_', '-').toLowerCase();
    if (l.indexOf(lang.toLowerCase().slice(0, 2)) !== 0) continue;
    if (want && v.name === want) return v;
    if (BAD.test(v.name)) continue;
    var n = v.name.toLowerCase(), sc = l.indexOf(lang.toLowerCase()) === 0 ? 5 : 0;
    if (/premium/.test(n)) sc += 30;
    if (/enhanced|neural|natural/.test(n)) sc += 20;
    for (var g = 0; g < GOOD.length; g++) if (n.indexOf(GOOD[g]) >= 0) { sc += 15 - g * 0.5; break; }
    if (sc > bestScore) { best = v; bestScore = sc; }
  }
  return best;
}
function say(t, lang, rate) {
  try {
    speechSynthesis.cancel();
    var P = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) P[p[0]] = decodeURIComponent(p[1] || ''); });
    var u = new SpeechSynthesisUtterance(t);
    u.lang = lang || 'zh-TW';
    var en = u.lang.indexOf('en') === 0;
    u.rate = rate || (en ? (parseFloat(P.rate) || 0.75) : 0.9);
    var v = pickVoice(u.lang, en ? P.voice : '');
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
var steps = [].slice.call(document.querySelectorAll('.step')), cur = 0, prog = document.querySelector('.prog');
steps.forEach(function () { prog.appendChild(document.createElement('i')); });
function go(n) {
  cur = Math.max(0, Math.min(steps.length - 1, n));
  steps.forEach(function (s, i) { s.classList.toggle('on', i === cur); });
  [].forEach.call(prog.children, function (d, i) { d.classList.toggle('on', i <= cur); });
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = cur === steps.length - 1 ? '🎉 學完了' : '下一步 ▶';
  window.scrollTo(0, 0);
  var s = steps[cur];
  if (s.dataset.auto) say(s.dataset.auto, s.dataset.lang);
  if (window.onStep) window.onStep(cur, s);
}
document.getElementById('prev').onclick = function () { go(cur - 1); };
document.getElementById('next').onclick = function () {
  if (cur < steps.length - 1) return go(cur + 1);
  document.querySelector('.wrap').innerHTML = '<h1 style="margin-top:40px">🎉 學完了！</h1><p class="big">Ivan勇士好棒！<br>按左上角的 ✕ 回到今日任務。</p><p class="center" style="font-size:90px">🏆</p>';
  document.querySelector('.nav').remove();
  say('學完了！Ivan勇士好棒！');
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) say(b.dataset.say, b.dataset.lang); });
[].forEach.call(document.querySelectorAll('.quiz'), function (q) {
  q.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || q.dataset.done) return;
    var fb = q.parentNode.querySelector('.fb'), ok = b.hasAttribute('data-right');
    b.classList.add(ok ? 'right' : 'wrong');
    if (ok) { q.dataset.done = 1; fb.style.color = '#0e6b2e'; fb.textContent = '🎉 答對了！' + (q.dataset.why || ''); say('答對了！' + (q.dataset.why || '')); }
    else { fb.style.color = '#a0161b'; fb.textContent = '再想想看！'; say('再想想看'); }
  });
});
go(0);
</script>
</body>
</html>
