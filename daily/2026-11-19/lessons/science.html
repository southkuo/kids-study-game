<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動物的身體和家</title>
<!--
  教學老師的教材範本（每天複製這個檔案到 daily/日期/lessons/科目.html 再改內容）
  規則：
  - 一個檔案就是一個完整教材，CSS、JS、圖都寫在裡面，不能載入任何外部網址。
  - 每一個 <section class="step"> 是一頁，下方會自動出現「上一步／下一步」和進度點。
  - data-auto="要念的話"：進到這一頁時自動朗讀（data-lang="en-US" 用英文念）。
  - 任何元素加上 data-say="要念的話"（可加 data-lang="en-US"），點了就會念。
  - 小測驗：<div class="quiz" data-why="答對時的補充說明"> 裡面放按鈕，正確的按鈕加 data-right，後面放 <div class="fb"></div>。
  - 需要每頁自己的動畫：寫 window.onStep = function (index, section) { … }，換頁時會呼叫。
  - 只改「教材內容」區塊和自訂樣式；下面的共用程式不要改壞。
-->
<style>
:root { --c: #2e9d5b; --ink: #2b2112; --bg: #fffaf0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
.prog { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.prog i { width: 14px; height: 14px; border-radius: 50%; background: #e0d6c3; }
.prog i.on { background: var(--c); }
.step { display: none; }
.step.on { display: block; animation: stepIn .45s ease-out; }
@keyframes stepIn { from { opacity: 0; transform: translateY(18px); } }
h1 { margin: 6px 0 10px; font-size: clamp(26px, 6.5vw, 38px); text-align: center; color: var(--c); }
.big { font-size: clamp(21px, 5.4vw, 29px); font-weight: 900; line-height: 1.55; text-align: center; margin: 8px 0; }
.small { font-size: 17px; font-weight: 700; text-align: center; color: #6a5536; }
.stage { position: relative; min-height: 240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; padding: 16px; border-radius: 24px; background: #fff; box-shadow: 0 5px 0 #eadfc8; overflow: hidden; }
.say { display: inline-flex; align-items: center; gap: 6px; margin: 6px; padding: 10px 18px; border: 0; border-radius: 999px; background: #e3f2fd; box-shadow: 0 3px 0 #90caf9; font: inherit; font-size: 18px; font-weight: 900; color: #0d47a1; cursor: pointer; }
.say:active { transform: translateY(2px); }
.center { text-align: center; }
.card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; padding: 12px 14px; border: 0; border-radius: 20px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; cursor: pointer; }
.card:active { transform: translateY(3px); }
.quiz { display: grid; gap: 10px; margin-top: 12px; }
.quiz button { min-height: 60px; padding: 8px 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 #d6c39a; font: inherit; font-size: clamp(19px, 5vw, 24px); font-weight: 900; color: var(--ink); cursor: pointer; }
.quiz button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.quiz button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.fb { min-height: 1.6em; margin-top: 10px; text-align: center; font-size: 20px; font-weight: 900; color: #0e6b2e; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,250,240,.96); box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
.nav button { flex: 1; min-height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
#prev { background: #fff; box-shadow: 0 4px 0 #d7c3ad; color: var(--ink); }
#next { background: linear-gradient(180deg, #ffe38a, #ffc93c 55%, #e09a12); box-shadow: 0 4px 0 #9a6608; color: #3a2208; }
.nav button:disabled { opacity: .4; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
/* ===== 自訂樣式（這一份教材自己的動畫）寫在這裡 ===== */
.scene { position: relative; width: 100%; height: 230px; border-radius: 18px; background: linear-gradient(#cdeeff 0 58%, #8fd18b 58% 78%, #6fc3ec 78%); overflow: hidden; }
.scene .a { position: absolute; font-size: 46px; }
.bird { left: 8%; top: 18px; animation: fly 5s ease-in-out infinite; }
@keyframes fly { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(60px, -10px); } 50% { transform: translate(120px, 10px) scaleX(-1); } 75% { transform: translate(60px, 0) scaleX(-1); } }
.bee { right: 12%; top: 40px; font-size: 36px !important; animation: buzz 1.2s ease-in-out infinite; }
@keyframes buzz { 50% { transform: translate(-12px, -8px) rotate(-10deg); } }
.fish { left: 20%; bottom: 6px; animation: swim 4s linear infinite; }
@keyframes swim { from { transform: translateX(-80px) scaleX(-1); } to { transform: translateX(260px) scaleX(-1); } }
.ant { left: 55%; top: 140px; font-size: 26px !important; animation: walk 3s linear infinite alternate; }
@keyframes walk { to { transform: translateX(-70px); } }
.turtle { right: 6%; top: 128px; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: 100%; }
.cards .card { min-height: 120px; }
.cards .card b { font-size: 50px; }
.cards .card span { font-size: 20px; font-weight: 900; color: #1f6e3f; }
.cards .card small { font-size: 17px; font-weight: 700; color: #6a5536; min-height: 1.4em; }
.cards .card.open { background: #dff5e7; box-shadow: 0 4px 0 #2e9d5b; }
.hex { display: inline-block; width: 46px; height: 50px; }
.game { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.who { font-size: 90px; line-height: 1; }
.who.go { animation: hop .5s ease-out; }
.who.shake { animation: shake .4s; }
@keyframes hop { 40% { transform: translateY(-24px); } }
@keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
.homes { display: grid; grid-template-columns: repeat(2, minmax(130px, 1fr)); gap: 10px; width: 100%; max-width: 440px; }
.homes button { min-height: 76px; border: 0; border-radius: 18px; background: #f0faf3; box-shadow: 0 4px 0 #9fd6b3; font: inherit; font-size: 21px; font-weight: 900; color: #1f6e3f; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.homes button .hex { width: 30px; height: 32px; }
.msg { min-height: 1.5em; font-size: 20px; font-weight: 900; text-align: center; color: #0e6b2e; }
</style>
</head>
<body>
<main class="wrap">
  <div class="prog"></div>

  <!-- ===== 教材內容 ===== -->
<section class="step" data-auto="小鳥在天上飛，魚在水裡游，蜜蜂嗡嗡嗡，螞蟻排隊走。每一種動物的身體都不一樣，住的家也不一樣喔！">
    <h1>🐾 動物的身體和家</h1>
    <div class="stage" style="padding:8px">
      <div class="scene">
        <span class="a bird" data-say="小鳥在天上飛。">🐦</span>
        <span class="a bee" data-say="蜜蜂嗡嗡嗡。">🐝</span>
        <span class="a ant" data-say="螞蟻排隊走。">🐜</span>
        <span class="a turtle" data-say="烏龜慢慢爬。">🐢</span>
        <span class="a fish" data-say="魚在水裡游。">🐟</span>
      </div>
    </div>
    <p class="big">身體不一樣，家也不一樣！</p>
    <p class="center"><button class="say" data-say="每一種動物的身體都不一樣，住的家也不一樣喔！">🔊 聽一聽</button></p>
  </section>

  <section class="step" data-auto="動物的身體有特別的本領。點一點卡片，看看牠們的身體可以做什麼。">
    <h1>💪 身體的本領</h1>
    <div class="stage">
      <div class="cards" id="skills">
        <button class="card" data-t="有翅膀和羽毛，可以飛" data-say="鳥有翅膀和羽毛，可以在天上飛。"><b>🐦</b><span>鳥</span><small>點我看看</small></button>
        <button class="card" data-t="有鰭可以游，用鰓呼吸" data-say="魚有鰭，可以在水裡游來游去。魚用鰓呼吸。"><b>🐟</b><span>魚</span><small>點我看看</small></button>
        <button class="card" data-t="腳上有蹼，可以划水" data-say="鴨子的腳趾中間有蹼，像小船槳一樣，可以划水。"><b>🦆</b><span>鴨子</span><small>點我看看</small></button>
        <button class="card" data-t="有硬硬的殼保護自己" data-say="烏龜有硬硬的殼。很多烏龜遇到危險時，會把頭和腳縮進殼裡保護自己。"><b>🐢</b><span>烏龜</span><small>點我看看</small></button>
        <button class="card" data-t="長耳朵聽得很清楚" data-say="兔子有長長的耳朵，可以聽到很小的聲音。"><b>🐰</b><span>兔子</span><small>點我看看</small></button>
        <button class="card" data-t="長鼻子可以拿東西、吸水" data-say="大象有長長的鼻子，可以拿東西，也可以吸水。"><b>🐘</b><span>大象</span><small>點我看看</small></button>
      </div>
    </div>
  </section>

  <section class="step" data-auto="動物的家在哪裡？小鳥用樹枝和草在樹上做巢。蜜蜂住在蜂巢，裡面是一格一格的六角形小房間。螞蟻住在地底下的蟻窩。魚住在水裡。點點看。">
    <h1>🏠 動物住在哪裡？</h1>
    <div class="stage">
      <div class="cards">
        <button class="card" data-say="小鳥用樹枝和草，在樹上做一個巢，在巢裡生蛋、照顧鳥寶寶。"><b>🌳</b><span>鳥 → 鳥巢</span><small>樹枝和草做的</small></button>
        <button class="card" data-say="蜜蜂住在蜂巢裡。蜂巢裡面是一格一格的六角形小房間。"><b><svg class="hex" viewBox="0 0 46 50"><polygon points="23,2 44,14 44,36 23,48 2,36 2,14" fill="#ffc93c" stroke="#b07a00" stroke-width="3"/><polygon points="23,14 33,20 33,30 23,36 13,30 13,20" fill="#ffe38a" stroke="#b07a00" stroke-width="2"/></svg></b><span>蜜蜂 → 蜂巢</span><small>六角形小房間</small></button>
        <button class="card" data-say="螞蟻住在地底下的蟻窩，裡面有很多彎彎曲曲的通道。"><b>🕳️</b><span>螞蟻 → 蟻窩</span><small>在地底下</small></button>
        <button class="card" data-say="魚住在水裡。有的住在河裡、湖裡，有的住在大海裡。"><b>🌊</b><span>魚 → 水裡</span><small>河、湖、大海</small></button>
      </div>
    </div>
    <p class="big">動物的家，可以<b>躲雨、休息、照顧寶寶</b>。</p>
  </section>

  <section class="step" data-auto="送動物回家！看看是哪一種動物，點牠的家。">
    <h1>🚚 送動物回家</h1>
    <div class="stage">
      <div class="game">
        <div class="who" id="who">🐦</div>
        <div class="homes" id="homes">
          <button data-h="nest">🌳 樹上的巢</button>
          <button data-h="hive"><svg class="hex" viewBox="0 0 46 50"><polygon points="23,2 44,14 44,36 23,48 2,36 2,14" fill="#ffc93c" stroke="#b07a00" stroke-width="3"/></svg> 蜂巢</button>
          <button data-h="ant">🕳️ 地底下</button>
          <button data-h="water">🌊 水裡</button>
        </div>
        <div class="msg" id="msg"></div>
      </div>
    </div>
    <p class="center"><button class="say" id="again">🔄 再玩一次</button></p>
  </section>

  <section class="step" data-auto="小測驗！鴨子腳上的蹼，有什麼用？">
    <h1>✏️ 小測驗 1</h1>
    <p class="big">🦆 鴨子腳上的「蹼」，有什麼用？</p>
    <div class="quiz" data-why="蹼長在腳趾中間，像小船槳一樣，鴨子用它來划水、游泳。">
      <button>用來爬樹</button><button data-right>用來划水</button><button>用來挖洞</button>
    </div>
    <div class="fb"></div>
  </section>

  <section class="step" data-auto="小測驗！魚在水裡，用什麼呼吸？">
    <h1>✏️ 小測驗 2</h1>
    <p class="big">🐟 魚在水裡，用什麼呼吸？</p>
    <div class="quiz" data-why="魚用鰓呼吸，所以可以一直住在水裡。鰭是用來游泳的。">
      <button>鰭</button><button data-right>鰓</button><button>殼</button>
    </div>
    <div class="fb"></div>
  </section>
  <!-- ===== 教材內容結束 ===== -->
</main>
<script>
// 第 2 頁：翻開本領
document.getElementById('skills').addEventListener('click', function (e) {
  var b = e.target.closest('.card'); if (!b) return;
  b.classList.add('open'); b.querySelector('small').textContent = b.dataset.t;
});
// 第 4 頁：送動物回家
var ANI = [['🐦', 'nest', '小鳥住在樹上的巢。'], ['🐟', 'water', '魚住在水裡，用鰓呼吸。'], ['🐝', 'hive', '蜜蜂住在蜂巢，裡面是六角形的小房間。'], ['🐜', 'ant', '螞蟻住在地底下的蟻窩。'], ['🐠', 'water', '熱帶魚也住在水裡。']];
var ai = 0;
function showAni() {
  var w = document.getElementById('who');
  if (ai >= ANI.length) { w.textContent = '🎉'; document.getElementById('msg').textContent = '大家都回家了！謝謝你！'; say('大家都回家了！謝謝你！'); return; }
  w.textContent = ANI[ai][0]; w.className = 'who'; void w.offsetWidth; w.className = 'who go';
}
function resetAni() { ai = 0; document.getElementById('msg').textContent = ''; showAni(); }
document.getElementById('homes').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || ai >= ANI.length) return;
  var a = ANI[ai], m = document.getElementById('msg'), w = document.getElementById('who');
  if (b.dataset.h === a[1]) { m.style.color = '#0e6b2e'; m.textContent = '✅ ' + a[2]; say('答對了！' + a[2]); ai++; setTimeout(showAni, 1100); }
  else { m.style.color = '#a0161b'; m.textContent = '不是這裡喔，再試試看！'; say('不是這裡喔，再試試看！'); w.className = 'who'; void w.offsetWidth; w.className = 'who shake'; }
});
document.getElementById('again').onclick = resetAni;
window.onStep = function (i) { if (i === 3) resetAni(); };
</script>
<nav class="nav"><button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button></nav>
<script>
/* ===== 共用程式（不要改） ===== */
function pickVoice(lang, want) {
  var BAD = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|fred|good news|hysterical|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|eloquence/i;
  var GOOD = ['samantha', 'ava', 'allison', 'susan', 'zoe', 'nicky', 'joelle', 'evan', 'nathan', 'tom', 'aaron', 'google us english', 'microsoft aria', 'microsoft jenny', 'microsoft guy'];
  var all = speechSynthesis.getVoices(), best = null, bestScore = -1;
  for (var i = 0; i < all.length; i++) {
    var v = all[i], l = v.lang.replace('_', '-').toLowerCase();
    if (l.indexOf(lang.toLowerCase().slice(0, 2)) !== 0) continue;
    if (want && v.name === want) return v;
    if (BAD.test(v.name)) continue;
    var n = v.name.toLowerCase(), sc = l.indexOf(lang.toLowerCase()) === 0 ? 5 : 0;
    if (/premium/.test(n)) sc += 30;
    if (/enhanced|neural|natural/.test(n)) sc += 20;
    for (var g = 0; g < GOOD.length; g++) if (n.indexOf(GOOD[g]) >= 0) { sc += 15 - g * 0.5; break; }
    if (sc > bestScore) { best = v; bestScore = sc; }
  }
  return best;
}
function say(t, lang, rate) {
  try {
    speechSynthesis.cancel();
    var P = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) P[p[0]] = decodeURIComponent(p[1] || ''); });
    var u = new SpeechSynthesisUtterance(t);
    u.lang = lang || 'zh-TW';
    var en = u.lang.indexOf('en') === 0;
    u.rate = rate || (en ? (parseFloat(P.rate) || 0.75) : 0.9);
    var v = pickVoice(u.lang, en ? P.voice : '');
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
var steps = [].slice.call(document.querySelectorAll('.step')), cur = 0, prog = document.querySelector('.prog');
steps.forEach(function () { prog.appendChild(document.createElement('i')); });
function go(n) {
  cur = Math.max(0, Math.min(steps.length - 1, n));
  steps.forEach(function (s, i) { s.classList.toggle('on', i === cur); });
  [].forEach.call(prog.children, function (d, i) { d.classList.toggle('on', i <= cur); });
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = cur === steps.length - 1 ? '🎉 學完了' : '下一步 ▶';
  window.scrollTo(0, 0);
  var s = steps[cur];
  if (s.dataset.auto) say(s.dataset.auto, s.dataset.lang);
  if (window.onStep) window.onStep(cur, s);
}
document.getElementById('prev').onclick = function () { go(cur - 1); };
document.getElementById('next').onclick = function () {
  if (cur < steps.length - 1) return go(cur + 1);
  document.querySelector('.wrap').innerHTML = '<h1 style="margin-top:40px">🎉 學完了！</h1><p class="big">Ivan勇士好棒！<br>按左上角的 ✕ 回到今日任務。</p><p class="center" style="font-size:90px">🏆</p>';
  document.querySelector('.nav').remove();
  say('學完了！Ivan勇士好棒！');
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) say(b.dataset.say, b.dataset.lang); });
[].forEach.call(document.querySelectorAll('.quiz'), function (q) {
  q.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || q.dataset.done) return;
    var fb = q.parentNode.querySelector('.fb'), ok = b.hasAttribute('data-right');
    b.classList.add(ok ? 'right' : 'wrong');
    if (ok) { q.dataset.done = 1; fb.style.color = '#0e6b2e'; fb.textContent = '🎉 答對了！' + (q.dataset.why || ''); say('答對了！' + (q.dataset.why || '')); }
    else { fb.style.color = '#a0161b'; fb.textContent = '再想想看！'; say('再想想看'); }
  });
});
go(0);
</script>
</body>
</html>
