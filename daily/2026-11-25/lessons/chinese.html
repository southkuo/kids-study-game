<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>言字旁和單人旁</title>
<!--
  教學老師的教材範本（每天複製這個檔案到 daily/日期/lessons/科目.html 再改內容）
  規則：
  - 一個檔案就是一個完整教材，CSS、JS、圖都寫在裡面，不能載入任何外部網址。
  - 每一個 <section class="step"> 是一頁，下方會自動出現「上一步／下一步」和進度點。
  - data-auto="要念的話"：進到這一頁時自動朗讀（data-lang="en-US" 用英文念）。
  - 任何元素加上 data-say="要念的話"（可加 data-lang="en-US"），點了就會念。
  - 小測驗：<div class="quiz" data-why="答對時的補充說明"> 裡面放按鈕，正確的按鈕加 data-right，後面放 <div class="fb"></div>。
  - 需要每頁自己的動畫：寫 window.onStep = function (index, section) { … }，換頁時會呼叫。
  - 只改「教材內容」區塊和自訂樣式；下面的共用程式不要改壞。
-->
<style>
:root { --c: #ff7043; --ink: #2b2112; --bg: #fffaf0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
.prog { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.prog i { width: 14px; height: 14px; border-radius: 50%; background: #e0d6c3; }
.prog i.on { background: var(--c); }
.step { display: none; }
.step.on { display: block; animation: stepIn .45s ease-out; }
@keyframes stepIn { from { opacity: 0; transform: translateY(18px); } }
h1 { margin: 6px 0 10px; font-size: clamp(26px, 6.5vw, 38px); text-align: center; color: var(--c); }
.big { font-size: clamp(21px, 5.4vw, 29px); font-weight: 900; line-height: 1.55; text-align: center; margin: 8px 0; }
.small { font-size: 17px; font-weight: 700; text-align: center; color: #6a5536; }
.stage { position: relative; min-height: 240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; padding: 16px; border-radius: 24px; background: #fff; box-shadow: 0 5px 0 #eadfc8; overflow: hidden; }
.say { display: inline-flex; align-items: center; gap: 6px; margin: 6px; padding: 10px 18px; border: 0; border-radius: 999px; background: #e3f2fd; box-shadow: 0 3px 0 #90caf9; font: inherit; font-size: 18px; font-weight: 900; color: #0d47a1; cursor: pointer; }
.say:active { transform: translateY(2px); }
.center { text-align: center; }
.card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; padding: 12px 14px; border: 0; border-radius: 20px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; cursor: pointer; }
.card:active { transform: translateY(3px); }
.quiz { display: grid; gap: 10px; margin-top: 12px; }
.quiz button { min-height: 60px; padding: 8px 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 #d6c39a; font: inherit; font-size: clamp(19px, 5vw, 24px); font-weight: 900; color: var(--ink); cursor: pointer; }
.quiz button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.quiz button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.fb { min-height: 1.6em; margin-top: 10px; text-align: center; font-size: 20px; font-weight: 900; color: #0e6b2e; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,250,240,.96); box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
.nav button { flex: 1; min-height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
#prev { background: #fff; box-shadow: 0 4px 0 #d7c3ad; color: var(--ink); }
#next { background: linear-gradient(180deg, #ffe38a, #ffc93c 55%, #e09a12); box-shadow: 0 4px 0 #9a6608; color: #3a2208; }
.nav button:disabled { opacity: .4; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
/* ===== 自訂樣式（這一份教材自己的動畫）寫在這裡 ===== */
:root { --c: #c0573b; }
.duo { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.morph { position: relative; width: 150px; height: 190px; border-radius: 22px; background: #fff4ee; box-shadow: 0 4px 0 #f0c9b5; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.morph .pic { font-size: 54px; animation: bob 1.6s ease-in-out infinite; }
.morph .ch { font-size: 70px; font-weight: 900; color: #c0573b; line-height: 1.1; }
.morph .ch.b { position: absolute; bottom: 14px; opacity: 0; }
.morph.go .ch.a { animation: fadeOut 2.4s 1s forwards; }
.morph.go .ch.b { animation: fadeIn 2.4s 1s forwards; }
@keyframes bob { 50% { transform: translateY(-8px); } }
@keyframes fadeOut { 40% { opacity: 1; } 60%, 100% { opacity: 0; } }
@keyframes fadeIn { 0%, 50% { opacity: 0; transform: scale(.6); } 75%, 100% { opacity: 1; transform: scale(1); } }
.build { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 120px; font-size: 84px; font-weight: 900; }
.build .L { color: #c0573b; }
.build .R { color: #5a6f8a; }
.build.go .L { animation: inL .7s ease-out both; }
.build.go .R { animation: inR .7s ease-out both; }
.build .full { color: #2b2112; animation: pop .5s ease-out both; }
@keyframes inL { from { transform: translateX(-120px); opacity: 0; } }
@keyframes inR { from { transform: translateX(120px); opacity: 0; } }
@keyframes pop { from { transform: scale(.3); } 70% { transform: scale(1.15); } }
.plus { font-size: 40px; color: #9a8466; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid .card { min-width: 0; min-height: 110px; }
.grid .card b { font-size: 46px; color: #2b2112; }
.grid .card small { font-size: 17px; font-weight: 700; color: #7a6040; }
.grid .card.on { background: #ffe5d8; box-shadow: 0 4px 0 #c0573b; }
.sortbox { text-align: center; }
.now { display: inline-block; min-width: 130px; padding: 6px 20px; border-radius: 22px; background: #fff; box-shadow: 0 5px 0 #eadfc8; font-size: 86px; font-weight: 900; }
.now.fly-l { animation: flyL .5s ease-in forwards; }
.now.fly-r { animation: flyR .5s ease-in forwards; }
.now.shake { animation: shake .4s; }
@keyframes flyL { to { transform: translate(-120px, 120px) scale(.3); opacity: 0; } }
@keyframes flyR { to { transform: translate(120px, 120px) scale(.3); opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
.baskets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.bk { min-height: 110px; border: 0; border-radius: 20px; font: inherit; font-size: 21px; font-weight: 900; cursor: pointer; }
.bk.yan { background: #ffe5d8; box-shadow: 0 4px 0 #c0573b; color: #8a2f18; }
.bk.ren { background: #e1edff; box-shadow: 0 4px 0 #2c6fbb; color: #1d4e8a; }
.bk:active { transform: translateY(3px); }
.bk .got { display: block; min-height: 1.4em; font-size: 26px; letter-spacing: 4px; }
.msg { text-align: center; font-size: 20px; font-weight: 900; min-height: 3em; line-height: 1.5; margin-top: 10px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="prog"></div>

  <!-- ===== 教材內容：每一頁一個 section.step ===== -->
  <section class="step" data-auto="嘴巴說話，就變成言；一個人站著，就變成人。今天來認識言字旁和單人旁！">
    <h1>💬 言字旁和單人旁 🧍</h1>
    <div class="stage">
      <div class="duo">
        <div class="morph" data-say="說話，言。"><div class="pic">💬</div><div class="ch a">言</div><div class="ch b">言</div></div>
        <div class="morph" data-say="人，變成單人旁。"><div class="pic">🧍</div><div class="ch a">人</div><div class="ch b">亻</div></div>
      </div>
    </div>
    <p class="big">「言」放在左邊，叫<span style="color:#c0573b">言字旁</span>。<br>「人」放在左邊變成「亻」，叫<span style="color:#2c6fbb">單人旁</span>。</p>
    <p class="center"><button class="say" data-say="言放在左邊，叫言字旁。人放在左邊，變成單人旁。">🔊 聽一聽</button></p>
  </section>

  <section class="step" data-auto="言字旁的字，常常和說話有關。點一個字，看看它是怎麼拼起來的。">
    <h1>💬 言字旁：和「說話」有關</h1>
    <div class="stage" style="min-height:140px"><div class="build" id="b1"><span class="full">言</span></div></div>
    <div class="grid" id="g1">
      <button class="card" data-l="言" data-r="兌" data-c="說" data-w="說話"><b>說</b><small>說話</small></button>
      <button class="card" data-l="言" data-r="舌" data-c="話" data-w="講話"><b>話</b><small>講話</small></button>
      <button class="card" data-l="言" data-r="賣" data-c="讀" data-w="讀書"><b>讀</b><small>讀書</small></button>
      <button class="card" data-l="言" data-r="青" data-c="請" data-w="請坐"><b>請</b><small>請坐</small></button>
      <button class="card" data-l="言" data-r="射" data-c="謝" data-w="謝謝"><b>謝</b><small>謝謝</small></button>
      <button class="card" data-l="言" data-r="己" data-c="記" data-w="記得"><b>記</b><small>記得</small></button>
    </div>
    <p class="small">說話、讀書、說謝謝，都要用嘴巴說出來唷！</p>
  </section>

  <section class="step" data-auto="單人旁的字，常常和人有關。點一個字，看看它是怎麼拼起來的。">
    <h1>🧍 單人旁：和「人」有關</h1>
    <div class="stage" style="min-height:140px"><div class="build" id="b2"><span class="full" style="color:#2c6fbb">亻</span></div></div>
    <div class="grid" id="g2">
      <button class="card" data-l="亻" data-r="尔" data-c="你" data-w="你好"><b>你</b><small>你好</small></button>
      <button class="card" data-l="亻" data-r="也" data-c="他" data-w="他們"><b>他</b><small>他們</small></button>
      <button class="card" data-l="亻" data-r="門" data-c="們" data-w="我們"><b>們</b><small>我們</small></button>
      <button class="card" data-l="亻" data-r="木" data-c="休" data-w="休息"><b>休</b><small>休息</small></button>
      <button class="card" data-l="亻" data-r="主" data-c="住" data-w="住家"><b>住</b><small>住家</small></button>
      <button class="card" data-l="亻" data-r="故" data-c="做" data-w="做事"><b>做</b><small>做事</small></button>
    </div>
    <p class="small">「休」是一個人靠在樹（木）旁邊休息 🧍🌳</p>
  </section>

  <section class="step" data-auto="分分看！看看字的左邊，是言字旁，還是單人旁？點下面的籃子。">
    <h1>🧺 分分看</h1>
    <p class="small">看字的<b>左邊</b>，點對的籃子 👇</p>
    <div class="sortbox"><span class="now" id="now">語</span></div>
    <div class="baskets">
      <button class="bk yan" data-k="言">💬 言字旁<span class="got" id="gy"></span></button>
      <button class="bk ren" data-k="亻">🧍 單人旁<span class="got" id="gr"></span></button>
    </div>
    <div class="msg" id="msg">&nbsp;</div>
  </section>

  <section class="step" data-auto="小測驗！下面哪一個字是言字旁？">
    <h1>✏️ 小測驗 1</h1>
    <p class="big">哪一個字是<span style="color:#c0573b">言字旁</span>？</p>
    <div class="quiz" data-why="「謝」的左邊是「言」，說謝謝要用嘴巴說。「拍」是提手旁，「晴」是日字旁，「跑」是足字旁。">
      <button>拍</button><button data-right>謝</button><button>晴</button><button>跑</button>
    </div>
    <div class="fb"></div>
  </section>

  <section class="step" data-auto="小測驗！小安和小樂是好朋友，什麼常常一起玩？選對的字。">
    <h1>✏️ 小測驗 2</h1>
    <p class="big">小安和小樂是好朋友，<br>（　　）常常一起玩。</p>
    <div class="quiz" data-why="「他們」說的是好幾個人，所以「們」要用單人旁。「門」是家裡的大門，「悶」是心裡不開心。">
      <button>他門</button><button>他悶</button><button data-right>他們</button>
    </div>
    <div class="fb"></div>
  </section>
  <!-- ===== 教材內容結束 ===== -->
</main>
<script>
// 第 1 頁：言、人變身
function playMorph() {
  [].forEach.call(document.querySelectorAll('.morph'), function (m) { m.classList.remove('go'); void m.offsetWidth; m.classList.add('go'); });
}
// 第 2、3 頁：拼字
function setupBuild(gridId, buildId, kind) {
  var box = document.getElementById(buildId);
  document.getElementById(gridId).addEventListener('click', function (e) {
    var c = e.target.closest('.card'); if (!c) return;
    [].forEach.call(this.children, function (x) { x.classList.remove('on'); });
    c.classList.add('on');
    clearTimeout(box._t);
    box.className = 'build';
    box.innerHTML = '<span class="L">' + c.dataset.l + '</span><span class="plus">＋</span><span class="R">' + c.dataset.r + '</span>';
    void box.offsetWidth; box.classList.add('go');
    box._t = setTimeout(function () { box.className = 'build'; box.innerHTML = '<span class="full">' + c.dataset.c + '</span>'; }, 1300);
    say(c.dataset.c + '，' + c.dataset.w + '的' + c.dataset.c + '。左邊是' + kind + '。');
  });
}
setupBuild('g1', 'b1', '言字旁');
setupBuild('g2', 'b2', '單人旁');
// 第 4 頁：分分看
var SORT = [
  ['語', '言', '說話的語'], ['你', '亻', '你好的你'], ['謝', '言', '謝謝的謝'], ['信', '亻', '寫信的信'],
  ['休', '亻', '休息的休'], ['讀', '言', '讀書的讀'], ['們', '亻', '我們的們'], ['話', '言', '說話的話']
];
var si = 0, nowEl = document.getElementById('now'), msg = document.getElementById('msg'), busy = false;
function showSort() {
  nowEl.className = 'now';
  if (si >= SORT.length) { nowEl.textContent = '🏆'; msg.textContent = '全部分好了！好厲害！'; say('全部分好了！好厲害！'); return; }
  nowEl.textContent = SORT[si][0];
}
[].forEach.call(document.querySelectorAll('.bk'), function (b) {
  b.onclick = function () {
    if (busy || si >= SORT.length) return;
    var it = SORT[si];
    if (b.dataset.k === it[1]) {
      busy = true;
      nowEl.classList.add(it[1] === '言' ? 'fly-l' : 'fly-r');
      document.getElementById(it[1] === '言' ? 'gy' : 'gr').textContent += it[0];
      if (it[0] === '信') { msg.textContent = '✅ 「信」的言在右邊，左邊是「亻」，所以是單人旁！'; say('對！信的言在右邊，左邊是單人旁。'); }
      else { msg.textContent = '✅ 答對了！' + it[2] + '，左邊是' + (it[1] === '言' ? '言字旁' : '單人旁') + '。'; say('對！' + it[2] + '，' + (it[1] === '言' ? '言字旁' : '單人旁')); }
      setTimeout(function () { si++; busy = false; showSort(); }, 700);
    } else {
      nowEl.classList.remove('shake'); void nowEl.offsetWidth; nowEl.classList.add('shake');
      msg.textContent = '再看一次字的左邊唷！';
      say('再看一次字的左邊唷');
    }
  };
});
showSort();
window.onStep = function (i) { if (i === 0) playMorph(); };

</script>
<nav class="nav"><button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button></nav>
<script>
/* ===== 共用程式（不要改） ===== */
function pickVoice(lang, want) {
  var BAD = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|fred|good news|hysterical|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|eloquence/i;
  var GOOD = ['samantha', 'ava', 'allison', 'susan', 'zoe', 'nicky', 'joelle', 'evan', 'nathan', 'tom', 'aaron', 'google us english', 'microsoft aria', 'microsoft jenny', 'microsoft guy'];
  var all = speechSynthesis.getVoices(), best = null, bestScore = -1;
  for (var i = 0; i < all.length; i++) {
    var v = all[i], l = v.lang.replace('_', '-').toLowerCase();
    if (l.indexOf(lang.toLowerCase().slice(0, 2)) !== 0) continue;
    if (want && v.name === want) return v;
    if (BAD.test(v.name)) continue;
    var n = v.name.toLowerCase(), sc = l.indexOf(lang.toLowerCase()) === 0 ? 5 : 0;
    if (/premium/.test(n)) sc += 30;
    if (/enhanced|neural|natural/.test(n)) sc += 20;
    for (var g = 0; g < GOOD.length; g++) if (n.indexOf(GOOD[g]) >= 0) { sc += 15 - g * 0.5; break; }
    if (sc > bestScore) { best = v; bestScore = sc; }
  }
  return best;
}
function say(t, lang, rate) {
  try {
    speechSynthesis.cancel();
    var P = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) P[p[0]] = decodeURIComponent(p[1] || ''); });
    var u = new SpeechSynthesisUtterance(t);
    u.lang = lang || 'zh-TW';
    var en = u.lang.indexOf('en') === 0;
    u.rate = rate || (en ? (parseFloat(P.rate) || 0.75) : 0.9);
    var v = pickVoice(u.lang, en ? P.voice : '');
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
var steps = [].slice.call(document.querySelectorAll('.step')), cur = 0, prog = document.querySelector('.prog');
steps.forEach(function () { prog.appendChild(document.createElement('i')); });
function go(n) {
  cur = Math.max(0, Math.min(steps.length - 1, n));
  steps.forEach(function (s, i) { s.classList.toggle('on', i === cur); });
  [].forEach.call(prog.children, function (d, i) { d.classList.toggle('on', i <= cur); });
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = cur === steps.length - 1 ? '🎉 學完了' : '下一步 ▶';
  window.scrollTo(0, 0);
  var s = steps[cur];
  if (s.dataset.auto) say(s.dataset.auto, s.dataset.lang);
  if (window.onStep) window.onStep(cur, s);
}
document.getElementById('prev').onclick = function () { go(cur - 1); };
document.getElementById('next').onclick = function () {
  if (cur < steps.length - 1) return go(cur + 1);
  document.querySelector('.wrap').innerHTML = '<h1 style="margin-top:40px">🎉 學完了！</h1><p class="big">Ivan勇士好棒！<br>按左上角的 ✕ 回到今日任務。</p><p class="center" style="font-size:90px">🏆</p>';
  document.querySelector('.nav').remove();
  say('學完了！Ivan勇士好棒！');
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) say(b.dataset.say, b.dataset.lang); });
[].forEach.call(document.querySelectorAll('.quiz'), function (q) {
  q.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || q.dataset.done) return;
    var fb = q.parentNode.querySelector('.fb'), ok = b.hasAttribute('data-right');
    b.classList.add(ok ? 'right' : 'wrong');
    if (ok) { q.dataset.done = 1; fb.style.color = '#0e6b2e'; fb.textContent = '🎉 答對了！' + (q.dataset.why || ''); say('答對了！' + (q.dataset.why || '')); }
    else { fb.style.color = '#a0161b'; fb.textContent = '再想想看！'; say('再想想看'); }
  });
});
go(0);
</script>
</body>
</html>
