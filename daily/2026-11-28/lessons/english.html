<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helping at Home</title>
<!--
  教學老師的教材範本（每天複製這個檔案到 daily/日期/lessons/科目.html 再改內容）
  規則：
  - 一個檔案就是一個完整教材，CSS、JS、圖都寫在裡面，不能載入任何外部網址。
  - 每一個 <section class="step"> 是一頁，下方會自動出現「上一步／下一步」和進度點。
  - data-auto="要念的話"：進到這一頁時自動朗讀（data-lang="en-US" 用英文念）。
  - 任何元素加上 data-say="要念的話"（可加 data-lang="en-US"），點了就會念。
  - 小測驗：<div class="quiz" data-why="答對時的補充說明"> 裡面放按鈕，正確的按鈕加 data-right，後面放 <div class="fb"></div>。
  - 需要每頁自己的動畫：寫 window.onStep = function (index, section) { … }，換頁時會呼叫。
  - 只改「教材內容」區塊和自訂樣式；下面的共用程式不要改壞。
-->
<style>
:root { --c: #ff7043; --ink: #2b2112; --bg: #fffaf0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
.prog { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.prog i { width: 14px; height: 14px; border-radius: 50%; background: #e0d6c3; }
.prog i.on { background: var(--c); }
.step { display: none; }
.step.on { display: block; animation: stepIn .45s ease-out; }
@keyframes stepIn { from { opacity: 0; transform: translateY(18px); } }
h1 { margin: 6px 0 10px; font-size: clamp(26px, 6.5vw, 38px); text-align: center; color: var(--c); }
.big { font-size: clamp(21px, 5.4vw, 29px); font-weight: 900; line-height: 1.55; text-align: center; margin: 8px 0; }
.small { font-size: 17px; font-weight: 700; text-align: center; color: #6a5536; }
.stage { position: relative; min-height: 240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; padding: 16px; border-radius: 24px; background: #fff; box-shadow: 0 5px 0 #eadfc8; overflow: hidden; }
.say { display: inline-flex; align-items: center; gap: 6px; margin: 6px; padding: 10px 18px; border: 0; border-radius: 999px; background: #e3f2fd; box-shadow: 0 3px 0 #90caf9; font: inherit; font-size: 18px; font-weight: 900; color: #0d47a1; cursor: pointer; }
.say:active { transform: translateY(2px); }
.center { text-align: center; }
.card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; padding: 12px 14px; border: 0; border-radius: 20px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; cursor: pointer; }
.card:active { transform: translateY(3px); }
.quiz { display: grid; gap: 10px; margin-top: 12px; }
.quiz button { min-height: 60px; padding: 8px 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 #d6c39a; font: inherit; font-size: clamp(19px, 5vw, 24px); font-weight: 900; color: var(--ink); cursor: pointer; }
.quiz button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.quiz button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.fb { min-height: 1.6em; margin-top: 10px; text-align: center; font-size: 20px; font-weight: 900; color: #0e6b2e; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,250,240,.96); box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
.nav button { flex: 1; min-height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
#prev { background: #fff; box-shadow: 0 4px 0 #d7c3ad; color: var(--ink); }
#next { background: linear-gradient(180deg, #ffe38a, #ffc93c 55%, #e09a12); box-shadow: 0 4px 0 #9a6608; color: #3a2208; }
.nav button:disabled { opacity: .4; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
/* ===== 自訂樣式（這一份教材自己的動畫）寫在這裡 ===== */
:root { --c: #3f6fe0; }
.house { position: relative; width: 100%; height: 230px; }
.house .roofs { position: absolute; left: 50%; top: 6px; margin-left: -110px; width: 220px; height: 0; border-left: 110px solid transparent; border-right: 110px solid transparent; border-bottom: 70px solid #e57373; }
.house .body { position: absolute; left: 50%; top: 76px; margin-left: -95px; width: 190px; height: 140px; background: #fff3d6; border: 4px solid #d9b26f; border-radius: 0 0 14px 14px; }
.house .pop { position: absolute; font-size: 40px; opacity: 0; animation: popin .5s ease-out forwards; }
@keyframes popin { 0% { transform: scale(0) translateY(30px); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
.helper { position: absolute; left: 50%; top: 120px; margin-left: -28px; font-size: 56px; animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
.grid .card { min-width: 0; }
.grid .card .e { font-size: 44px; }
.grid .card .en { font-size: 19px; font-weight: 900; color: #23439a; }
.grid .card .zh { font-size: 17px; font-weight: 700; color: #6a5536; }
.grid .card.hit { background: #e3ecff; box-shadow: 0 4px 0 #8fa9ef; }
.room { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.mess { min-height: 120px; border: 0; border-radius: 20px; background: #fff0f0; box-shadow: 0 4px 0 #f0b9b9; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.mess .e { font-size: 46px; transition: transform .4s; }
.mess .t { font-size: 17px; font-weight: 900; color: #a0161b; }
.mess.clean { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; }
.mess.clean .t { color: #0e6b2e; }
.mess.clean .e { animation: spin .6s ease-out; }
@keyframes spin { from { transform: rotate(-200deg) scale(.3); } }
.line { min-height: 2.8em; width: 100%; text-align: center; font-size: clamp(21px, 5.6vw, 28px); font-weight: 900; color: #23439a; line-height: 1.4; }
.line small { display: block; font-size: 17px; color: #6a5536; }
.who { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
.who button { min-width: 120px; min-height: 64px; border: 0; border-radius: 18px; background: #eef3ff; box-shadow: 0 4px 0 #a9bff3; font: inherit; font-size: 20px; font-weight: 900; color: #23439a; cursor: pointer; }
.who button.on { background: #3f6fe0; color: #fff; box-shadow: 0 4px 0 #23439a; }
.pot { font-size: 64px; animation: bob 1.2s ease-in-out infinite; }
.feel { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
.feel .card { min-width: 150px; }
.feel .card .e { font-size: 48px; }
.feel .card .en { font-size: 19px; font-weight: 900; color: #23439a; }
</style>
</head>
<body>
<main class="wrap">
  <div class="prog"></div>

  <!-- ===== 教材內容：每一頁一個 section.step ===== -->
  <section class="step" data-lang="en-US" data-auto="I help at home! Let's learn how to say the chores we do at home.">
    <h1>🏠 Helping at Home</h1>
    <div class="stage"><div class="house" id="house"></div></div>
    <p class="big">I help at home!<br><span class="small">我會在家幫忙！</span></p>
    <p class="center"><button class="say" data-lang="en-US" data-say="I help at home!">🔊 Listen</button><button class="say" id="hreplay">▶️ 再看一次</button></p>
  </section>

  <section class="step" data-auto="家事怎麼說？點卡片，聽英文。">
    <h1>🧹 Chores 家事</h1>
    <div class="grid">
      <button class="card" data-lang="en-US" data-say="I make my bed."><span class="e">🛏️</span><span class="en">make my bed</span><span class="zh">整理床鋪</span></button>
      <button class="card" data-lang="en-US" data-say="I set the table."><span class="e">🥢</span><span class="en">set the table</span><span class="zh">擺碗筷</span></button>
      <button class="card" data-lang="en-US" data-say="I wash the dishes."><span class="e">🍽️</span><span class="en">wash the dishes</span><span class="zh">洗碗</span></button>
      <button class="card" data-lang="en-US" data-say="I put away my toys."><span class="e">🧸</span><span class="en">put away my toys</span><span class="zh">把玩具收好</span></button>
      <button class="card" data-lang="en-US" data-say="I water the plants."><span class="e">🪴</span><span class="en">water the plants</span><span class="zh">幫植物澆水</span></button>
      <button class="card" data-lang="en-US" data-say="I sweep the floor."><span class="e">🧹</span><span class="en">sweep the floor</span><span class="zh">掃地</span></button>
    </div>
    <p class="small">說的時候前面加上 I，就是完整的句子：I make my bed.</p>
  </section>

  <section class="step" data-auto="房間好亂！點每一樣東西，幫忙整理，順便聽英文怎麼說。">
    <h1>✨ Clean Up! 來整理</h1>
    <div class="stage" style="flex-direction:column">
      <div class="room" id="room"></div>
      <div class="line" id="rline">Tap to help! <small>點一點來幫忙！</small></div>
    </div>
    <p class="center"><button class="say" id="rreset">🔄 再弄亂一次</button></p>
  </section>

  <section class="step" data-auto="Who cooks dinner in your family? 你家是誰煮晚餐？點一個人，聽完整的句子。">
    <h1>🍲 Who cooks dinner?</h1>
    <div class="stage" style="flex-direction:column">
      <div class="pot">🍲</div>
      <div class="line" id="wline">Who cooks dinner?<small>誰煮晚餐？</small></div>
      <div class="who" id="who">
        <button data-s="My mom cooks dinner." data-z="我媽媽煮晚餐。">👩 mom</button>
        <button data-s="My dad cooks dinner." data-z="我爸爸煮晚餐。">👨 dad</button>
        <button data-s="My grandma cooks dinner." data-z="我奶奶（外婆）煮晚餐。">👵 grandma</button>
        <button data-s="We cook dinner together." data-z="我們一起煮晚餐。">👨‍👩‍👦 together</button>
      </div>
    </div>
    <p class="small">小提醒：My mom cook<b style="color:#e53935">s</b>，一個人做的時候動詞後面加 s；We cook 不用加。</p>
  </section>

  <section class="step" data-auto="幫完忙，你覺得怎麼樣？How do you feel after you help your family? 點卡片聽一聽。">
    <h1>😊 How do you feel?</h1>
    <div class="feel">
      <button class="card" data-lang="en-US" data-say="I feel happy."><span class="e">😊</span><span class="en">I feel happy.</span><span class="small">我覺得很開心。</span></button>
      <button class="card" data-lang="en-US" data-say="I feel proud of myself."><span class="e">😎</span><span class="en">I feel proud of myself.</span><span class="small">我覺得自己很棒。</span></button>
      <button class="card" data-lang="en-US" data-say="I feel tired but happy."><span class="e">😅</span><span class="en">I feel tired but happy.</span><span class="small">有點累，但是很開心。</span></button>
    </div>
  </section>

  <section class="step" data-auto="小測驗！看圖，選出正確的英文。">
    <h1>✏️ Quiz 1</h1>
    <p class="big" style="font-size:72px;margin:4px 0">🪴💧</p>
    <p class="center"><button class="say" data-lang="en-US" data-say="What do you do to help at home?">🔊 What do you do to help at home?</button></p>
    <div class="quiz" data-why="植物要澆水，water the plants 就是幫植物澆水。make my bed 是整理床鋪，wash the dishes 是洗碗。">
      <button>I make my bed.</button><button data-right>I water the plants.</button><button>I wash the dishes.</button>
    </div>
    <div class="fb"></div>
  </section>

  <section class="step" data-auto="小測驗！哪一句是正確的英文？">
    <h1>✏️ Quiz 2</h1>
    <p class="big">爸爸煮晚餐，哪一句對？</p>
    <div class="quiz" data-why="說一個人做的事，動詞後面要加 s，所以是 My dad cooks dinner.">
      <button>My dad cook dinner.</button><button data-right>My dad cooks dinner.</button><button>My dad cooking dinner.</button>
    </div>
    <div class="fb"></div>
  </section>
  <!-- ===== 教材內容結束 ===== -->
</main>
<script>
// 第 1 頁：房子裡跳出家事
function houseAnim() {
  var h = document.getElementById('house');
  h.innerHTML = '<div class="roofs"></div><div class="body"></div><div class="helper">🧒</div>';
  var items = [['🛏️', 24, 20], ['🥢', 70, 14], ['🍽️', 8, 60], ['🧸', 80, 60], ['🪴', 22, 82], ['🧹', 68, 84]];
  items.forEach(function (it, i) {
    var s = document.createElement('span'); s.className = 'pop'; s.textContent = it[0];
    s.style.left = it[1] + '%'; s.style.top = it[2] + '%'; s.style.animationDelay = (0.4 + i * 0.35) + 's';
    h.appendChild(s);
  });
}
document.getElementById('hreplay').onclick = houseAnim;

// 第 3 頁：整理房間
var MESS = [['🛏️', '亂亂的床', 'I make my bed.', '我整理床鋪。'], ['🧸', '玩具在地上', 'I put away my toys.', '我把玩具收好。'], ['🍽️', '髒盤子', 'I wash the dishes.', '我洗碗。'], ['🥀', '植物口渴了', 'I water the plants.', '我幫植物澆水。'], ['🍂', '地上有葉子', 'I sweep the floor.', '我掃地。'], ['🥢', '還沒擺碗筷', 'I set the table.', '我擺碗筷。']];
var DONE = ['🛏️', '📦', '✨', '🪴', '🧹', '🍚'];
function drawRoom() {
  document.getElementById('room').innerHTML = MESS.map(function (m, i) { return '<button class="mess" data-i="' + i + '"><span class="e">' + m[0] + '</span><span class="t">' + m[1] + '</span></button>'; }).join('');
  document.getElementById('rline').innerHTML = 'Tap to help! <small>點一點來幫忙！</small>';
}
document.getElementById('room').addEventListener('click', function (e) {
  var b = e.target.closest('.mess'); if (!b) return;
  var i = +b.dataset.i, m = MESS[i];
  if (!b.classList.contains('clean')) {
    b.classList.add('clean');
    b.querySelector('.e').textContent = DONE[i];
    b.querySelector('.t').textContent = '好了！';
  }
  var left = document.querySelectorAll('.mess:not(.clean)').length;
  document.getElementById('rline').innerHTML = m[2] + '<small>' + m[3] + (left ? '' : ' 🎉 全部整理好了！') + '</small>';
  say(m[2], 'en-US');
});
document.getElementById('rreset').onclick = function () { drawRoom(); say('再弄亂一次！'); };

// 第 4 頁：誰煮晚餐
document.getElementById('who').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
  document.getElementById('wline').innerHTML = b.dataset.s + '<small>' + b.dataset.z + '</small>';
  say(b.dataset.s, 'en-US');
});

window.onStep = function (i) {
  if (i === 0) houseAnim();
  if (i === 2) drawRoom();
};
</script>
<nav class="nav"><button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button></nav>
<script>
/* ===== 共用程式（不要改） ===== */
function pickVoice(lang, want) {
  var BAD = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|fred|good news|hysterical|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|eloquence/i;
  var GOOD = ['samantha', 'ava', 'allison', 'susan', 'zoe', 'nicky', 'joelle', 'evan', 'nathan', 'tom', 'aaron', 'google us english', 'microsoft aria', 'microsoft jenny', 'microsoft guy'];
  var all = speechSynthesis.getVoices(), best = null, bestScore = -1;
  for (var i = 0; i < all.length; i++) {
    var v = all[i], l = v.lang.replace('_', '-').toLowerCase();
    if (l.indexOf(lang.toLowerCase().slice(0, 2)) !== 0) continue;
    if (want && v.name === want) return v;
    if (BAD.test(v.name)) continue;
    var n = v.name.toLowerCase(), sc = l.indexOf(lang.toLowerCase()) === 0 ? 5 : 0;
    if (/premium/.test(n)) sc += 30;
    if (/enhanced|neural|natural/.test(n)) sc += 20;
    for (var g = 0; g < GOOD.length; g++) if (n.indexOf(GOOD[g]) >= 0) { sc += 15 - g * 0.5; break; }
    if (sc > bestScore) { best = v; bestScore = sc; }
  }
  return best;
}
function say(t, lang, rate) {
  try {
    speechSynthesis.cancel();
    var P = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) P[p[0]] = decodeURIComponent(p[1] || ''); });
    var u = new SpeechSynthesisUtterance(t);
    u.lang = lang || 'zh-TW';
    var en = u.lang.indexOf('en') === 0;
    u.rate = rate || (en ? (parseFloat(P.rate) || 0.75) : 0.9);
    var v = pickVoice(u.lang, en ? P.voice : '');
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
var steps = [].slice.call(document.querySelectorAll('.step')), cur = 0, prog = document.querySelector('.prog');
steps.forEach(function () { prog.appendChild(document.createElement('i')); });
function go(n) {
  cur = Math.max(0, Math.min(steps.length - 1, n));
  steps.forEach(function (s, i) { s.classList.toggle('on', i === cur); });
  [].forEach.call(prog.children, function (d, i) { d.classList.toggle('on', i <= cur); });
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = cur === steps.length - 1 ? '🎉 學完了' : '下一步 ▶';
  window.scrollTo(0, 0);
  var s = steps[cur];
  if (s.dataset.auto) say(s.dataset.auto, s.dataset.lang);
  if (window.onStep) window.onStep(cur, s);
}
document.getElementById('prev').onclick = function () { go(cur - 1); };
document.getElementById('next').onclick = function () {
  if (cur < steps.length - 1) return go(cur + 1);
  document.querySelector('.wrap').innerHTML = '<h1 style="margin-top:40px">🎉 學完了！</h1><p class="big">Ivan勇士好棒！<br>按左上角的 ✕ 回到今日任務。</p><p class="center" style="font-size:90px">🏆</p>';
  document.querySelector('.nav').remove();
  say('學完了！Ivan勇士好棒！');
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) say(b.dataset.say, b.dataset.lang); });
[].forEach.call(document.querySelectorAll('.quiz'), function (q) {
  q.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || q.dataset.done) return;
    var fb = q.parentNode.querySelector('.fb'), ok = b.hasAttribute('data-right');
    b.classList.add(ok ? 'right' : 'wrong');
    if (ok) { q.dataset.done = 1; fb.style.color = '#0e6b2e'; fb.textContent = '🎉 答對了！' + (q.dataset.why || ''); say('答對了！' + (q.dataset.why || '')); }
    else { fb.style.color = '#a0161b'; fb.textContent = '再想想看！'; say('再想想看'); }
  });
});
go(0);
</script>
</body>
</html>
