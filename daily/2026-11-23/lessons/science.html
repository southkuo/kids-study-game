<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我們吃植物的哪裡？</title>
<style>
:root { --c: #2e9d5b; --ink: #2b2112; --bg: #fffaf0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
.prog { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.prog i { width: 14px; height: 14px; border-radius: 50%; background: #e0d6c3; }
.prog i.on { background: var(--c); }
.step { display: none; }
.step.on { display: block; animation: stepIn .45s ease-out; }
@keyframes stepIn { from { opacity: 0; transform: translateY(18px); } }
h1 { margin: 6px 0 10px; font-size: clamp(26px, 6.5vw, 38px); text-align: center; color: var(--c); }
.big { font-size: clamp(21px, 5.4vw, 29px); font-weight: 900; line-height: 1.55; text-align: center; margin: 8px 0; }
.small { font-size: 17px; font-weight: 700; text-align: center; color: #6a5536; }
.stage { position: relative; min-height: 240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; padding: 16px; border-radius: 24px; background: #fff; box-shadow: 0 5px 0 #eadfc8; overflow: hidden; }
.say { display: inline-flex; align-items: center; gap: 6px; margin: 6px; padding: 10px 18px; border: 0; border-radius: 999px; background: #e3f2fd; box-shadow: 0 3px 0 #90caf9; font: inherit; font-size: 18px; font-weight: 900; color: #0d47a1; cursor: pointer; }
.say:active { transform: translateY(2px); }
.center { text-align: center; }
.card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; padding: 12px 14px; border: 0; border-radius: 20px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; cursor: pointer; }
.card:active { transform: translateY(3px); }
.quiz { display: grid; gap: 10px; margin-top: 12px; }
.quiz button { min-height: 60px; padding: 8px 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 #d6c39a; font: inherit; font-size: clamp(19px, 5vw, 24px); font-weight: 900; color: var(--ink); cursor: pointer; }
.quiz button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.quiz button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.fb { min-height: 1.6em; margin-top: 10px; text-align: center; font-size: 20px; font-weight: 900; color: #0e6b2e; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,250,240,.96); box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
.nav button { flex: 1; min-height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
#prev { background: #fff; box-shadow: 0 4px 0 #d7c3ad; color: var(--ink); }
#next { background: linear-gradient(180deg, #ffe38a, #ffc93c 55%, #e09a12); box-shadow: 0 4px 0 #9a6608; color: #3a2208; }
.nav button:disabled { opacity: .4; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
/* ===== 自訂樣式 ===== */
.plate { position: relative; width: 100%; height: 220px; }
.plate .dish { position: absolute; left: 50%; bottom: 10px; width: 240px; height: 40px; margin-left: -120px; border-radius: 50%; background: #fff; box-shadow: 0 6px 0 #cfd8dc, inset 0 -6px 0 #eceff1; border: 3px solid #b0bec5; }
.plate .food { position: absolute; top: -60px; font-size: 52px; opacity: 0; }
.plate .food.drop { animation: drop .8s cubic-bezier(.3,1.4,.6,1) forwards; }
@keyframes drop { 0% { opacity: 1; top: -60px; } 100% { opacity: 1; top: 120px; } }
.plant { position: relative; width: 260px; height: 300px; margin: 0 auto; }
.plant svg { width: 100%; height: 100%; }
.part { cursor: pointer; transition: filter .3s; }
.part.hi { filter: drop-shadow(0 0 8px #ffd54f) drop-shadow(0 0 4px #ffb300); }
.tags { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.tags button { min-height: 52px; border: 0; border-radius: 16px; background: #e8f6ee; box-shadow: 0 3px 0 #8fd1a9; font: inherit; font-size: 19px; font-weight: 900; color: #1b6b3a; cursor: pointer; }
.tags button.on { background: #2e9d5b; color: #fff; box-shadow: 0 3px 0 #1b6b3a; }
.job { min-height: 2.6em; font-size: 20px; font-weight: 900; text-align: center; color: #1b6b3a; }
.foods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
.foods .card { min-width: 0; }
.foods .card span { font-size: 50px; }
.foods .card b { font-size: 20px; }
.foods .card em { font-style: normal; font-size: 18px; font-weight: 900; color: #fff; background: #2e9d5b; border-radius: 999px; padding: 2px 12px; visibility: hidden; }
.foods .card.open em { visibility: visible; animation: grow .4s ease-out; }
@keyframes grow { from { transform: scale(0); } }
.wow { padding: 10px 14px; border-radius: 16px; background: #fff8e1; font-size: 18px; font-weight: 800; text-align: center; color: #6d4c00; }
.qfood { font-size: 96px; line-height: 1.1; text-align: center; }
.qfood.pop { animation: grow .4s ease-out; }
.qname { font-size: 24px; font-weight: 900; text-align: center; }
.six { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-top: 10px; }
.six button { min-height: 56px; border: 0; border-radius: 16px; background: #fff; box-shadow: 0 4px 0 #8fd1a9; font: inherit; font-size: 20px; font-weight: 900; color: #1b6b3a; cursor: pointer; }
.six button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.six button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.msg { min-height: 2.6em; font-size: 19px; font-weight: 900; text-align: center; margin-top: 8px; }
.score { font-size: 18px; font-weight: 900; color: #2e9d5b; text-align: center; }
</style>
</head>
<body>
<main class="wrap">
  <div class="prog"></div>
  <section class="step" data-auto="我們每天吃的蔬菜和水果，都是植物。可是，我們吃的是植物身上的哪一個部分呢？">
    <h1>🥗 我們吃植物的哪裡？</h1>
    <div class="stage" style="padding:8px">
      <div class="plate" id="plate">
        <div class="dish"></div>
        <span class="food" style="left:18%">🥕</span>
        <span class="food" style="left:34%">🥬</span>
        <span class="food" style="left:50%">🍎</span>
        <span class="food" style="left:66%">🥦</span>
        <span class="food" style="left:80%">🥔</span>
      </div>
    </div>
    <p class="big">紅蘿蔔、青菜、蘋果……<br>是植物的哪個部分？🤔</p>
  </section>

  <section class="step" data-auto="先複習一下，植物的身體有根、莖、葉、花、果實、種子。點一點下面的按鈕，看看在哪裡。">
    <h1>🌱 植物的身體</h1>
    <div class="stage" style="flex-direction:column">
      <div class="plant">
        <svg viewBox="0 0 260 300" aria-label="植物圖">
          <rect x="0" y="230" width="260" height="70" fill="#a1887f" opacity=".45"/>
          <g class="part" id="pRoot" data-k="0">
            <path d="M130 232 C126 252 112 262 98 282 M130 232 C134 254 150 264 166 286 M130 232 L130 290 M118 250 C108 252 100 258 92 262 M142 250 C152 252 160 258 170 262" stroke="#8d6e63" stroke-width="6" fill="none" stroke-linecap="round"/>
          </g>
          <g class="part" id="pStem" data-k="1"><rect x="124" y="70" width="12" height="164" rx="6" fill="#43a047"/></g>
          <g class="part" id="pLeaf" data-k="2">
            <path d="M130 170 C100 140 70 150 56 168 C80 184 108 184 130 170Z" fill="#66bb6a"/>
            <path d="M130 140 C160 110 192 118 206 136 C182 154 152 154 130 140Z" fill="#66bb6a"/>
          </g>
          <g class="part" id="pFlower" data-k="3">
            <circle cx="130" cy="52" r="16" fill="#f48fb1"/><circle cx="108" cy="58" r="16" fill="#f48fb1"/><circle cx="152" cy="58" r="16" fill="#f48fb1"/>
            <circle cx="116" cy="78" r="16" fill="#f48fb1"/><circle cx="144" cy="78" r="16" fill="#f48fb1"/><circle cx="130" cy="66" r="11" fill="#ffd54f"/>
          </g>
          <g class="part" id="pFruit" data-k="4"><circle cx="196" cy="196" r="22" fill="#e53935"/><path d="M196 174 L196 162" stroke="#43a047" stroke-width="4"/><path d="M136 150 C170 160 190 166 196 174" stroke="#43a047" stroke-width="4" fill="none"/></g>
          <g class="part" id="pSeed" data-k="5"><ellipse cx="190" cy="198" rx="3.5" ry="5.5" fill="#fff8e1"/><ellipse cx="202" cy="198" rx="3.5" ry="5.5" fill="#fff8e1"/></g>
        </svg>
      </div>
      <div class="tags" id="tags">
        <button data-k="0">根</button><button data-k="1">莖</button><button data-k="2">葉</button>
        <button data-k="3">花</button><button data-k="4">果實</button><button data-k="5">種子</button>
      </div>
      <div class="job" id="job">點一點，看看在哪裡 👆</div>
    </div>
  </section>

  <section class="step" data-auto="紅蘿蔔和地瓜，是植物的根。馬鈴薯也長在土裡，可是它是莖喔！點卡片看答案。">
    <h1>🥕 吃根？吃莖？</h1>
    <div class="stage">
      <div class="foods">
        <button class="card" data-say="紅蘿蔔，我們吃的是根。"><span>🥕</span><b>紅蘿蔔</b><em>根</em></button>
        <button class="card" data-say="地瓜，我們吃的是根。"><span>🍠</span><b>地瓜</b><em>根</em></button>
        <button class="card" data-say="馬鈴薯，我們吃的是莖。"><span>🥔</span><b>馬鈴薯</b><em>莖</em></button>
        <button class="card" data-say="甘蔗，我們吃的是莖，甜甜的汁就在莖裡面。"><svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><g transform="rotate(30 30 30)"><rect x="25" y="2" width="10" height="56" rx="4" fill="#8d6e63"/><rect x="24" y="18" width="12" height="3" fill="#5d4037"/><rect x="24" y="36" width="12" height="3" fill="#5d4037"/><path d="M30 4 C40 -2 48 0 54 2" stroke="#66bb6a" stroke-width="3" fill="none"/></g></svg><b>甘蔗</b><em>莖</em></button>
      </div>
    </div>
    <div class="wow">😮 馬鈴薯上的小凹洞叫「芽眼」，會長出新芽。<br>它長在土裡，卻是植物的<b>莖</b>！</div>
  </section>

  <section class="step" data-auto="高麗菜和菠菜，我們吃的是葉子。花椰菜，我們吃的是花！點卡片看答案。">
    <h1>🥬 吃葉？吃花？</h1>
    <div class="stage">
      <div class="foods">
        <button class="card" data-say="高麗菜，我們吃的是葉子，一片一片包起來。"><span>🥬</span><b>高麗菜</b><em>葉</em></button>
        <button class="card" data-say="菠菜，我們吃的是葉子。"><span>🌿</span><b>菠菜</b><em>葉</em></button>
        <button class="card" data-say="花椰菜，我們吃的是還沒開的小花。"><span>🥦</span><b>花椰菜</b><em>花</em></button>
        <button class="card" data-say="金針花，我們吃的是花。"><span>🌼</span><b>金針花</b><em>花</em></button>
      </div>
    </div>
    <div class="wow">😮 花椰菜上一粒一粒的，是很多<b>還沒開的小花</b>！</div>
  </section>

  <section class="step" data-auto="蘋果、番茄、西瓜，我們吃的是果實。花生，我們吃的是種子。點卡片看答案。">
    <h1>🍎 吃果實？吃種子？</h1>
    <div class="stage">
      <div class="foods">
        <button class="card" data-say="蘋果，我們吃的是果實。"><span>🍎</span><b>蘋果</b><em>果實</em></button>
        <button class="card" data-say="番茄，我們吃的是果實，切開裡面有種子。"><span>🍅</span><b>番茄</b><em>果實</em></button>
        <button class="card" data-say="西瓜，我們吃的是果實，黑黑的是種子。"><span>🍉</span><b>西瓜</b><em>果實</em></button>
        <button class="card" data-say="花生，殼裡面的花生仁，是種子。"><span>🥜</span><b>花生</b><em>種子</em></button>
      </div>
    </div>
    <div class="wow">😮 果實是花變成的，果實裡面藏著<b>種子</b>。</div>
  </section>

  <section class="step" data-auto="猜猜看！我們吃的是植物的哪一個部分？">
    <h1>🔍 吃的是哪裡？</h1>
    <div class="stage" style="flex-direction:column">
      <div class="qfood" id="qf">🥕</div>
      <div class="qname" id="qn">紅蘿蔔</div>
      <div class="six" id="six">
        <button>根</button><button>莖</button><button>葉</button>
        <button>花</button><button>果實</button><button>種子</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="score" id="score"></div>
    </div>
    <p class="center"><button class="say" id="nextF">➡️ 下一個</button></p>
  </section>

  <section class="step" data-auto="小測驗第一題：花椰菜，我們吃的是植物的哪一個部分？">
    <h1>✏️ 小測驗 1</h1>
    <p class="big"><span style="font-size:70px">🥦</span><br>吃花椰菜，是吃植物的哪裡？</p>
    <div class="quiz" data-why="花椰菜上一粒一粒的，是很多還沒開的小花，所以我們吃的是花。">
      <button>根</button>
      <button data-right>花</button>
      <button>種子</button>
    </div>
    <div class="fb"></div>
  </section>

  <section class="step" data-auto="小測驗第二題：馬鈴薯長在土裡，它是植物的哪一個部分？">
    <h1>✏️ 小測驗 2</h1>
    <p class="big"><span style="font-size:70px">🥔</span><br>馬鈴薯是植物的哪裡？</p>
    <div class="quiz" data-why="馬鈴薯雖然長在土裡，可是它有芽眼，會長出新芽，它是植物的莖。">
      <button data-right>莖</button>
      <button>根</button>
      <button>果實</button>
    </div>
    <div class="fb"></div>
  </section>
</main>
<script>
var T = [];
function clearT() { T.forEach(clearTimeout); T = []; }
function $(id) { return document.getElementById(id); }
/* 開場：食物掉進盤子 */
function dropFood() {
  var fs = document.querySelectorAll('#plate .food');
  [].forEach.call(fs, function (f) { f.classList.remove('drop'); });
  void document.body.offsetWidth;
  [].forEach.call(fs, function (f, i) { T.push(setTimeout(function () { f.classList.add('drop'); }, 300 + i * 450)); });
}
/* 植物的身體 */
var PARTS = [
  ['pRoot', '根', '根抓住泥土，從土裡吸水。'],
  ['pStem', '莖', '莖撐住植物，把水送到葉子和花。'],
  ['pLeaf', '葉', '葉子曬太陽，幫植物做養分。'],
  ['pFlower', '花', '花謝了以後，會變成果實。'],
  ['pFruit', '果實', '果實是花變成的，裡面有種子。'],
  ['pSeed', '種子', '種子種下去，會長出新的植物。']
];
function showPart(k) {
  PARTS.forEach(function (p, i) { $(p[0]).classList.toggle('hi', i === k); });
  [].forEach.call(document.querySelectorAll('#tags button'), function (b) { b.classList.toggle('on', +b.dataset.k === k); });
  $('job').textContent = PARTS[k][1] + '：' + PARTS[k][2];
  say(PARTS[k][1] + '。' + PARTS[k][2]);
}
$('tags').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) showPart(+b.dataset.k); });
[].forEach.call(document.querySelectorAll('.part'), function (g) { g.addEventListener('click', function () { showPart(+g.dataset.k); }); });
/* 卡片翻開 */
[].forEach.call(document.querySelectorAll('.foods .card'), function (c) { c.addEventListener('click', function () { c.classList.add('open'); }); });
/* 猜猜看 */
var FOODS = [
  ['🥕', '紅蘿蔔', '根', '紅蘿蔔是根，長在土裡吸水。'],
  ['🥦', '花椰菜', '花', '花椰菜是很多還沒開的小花。'],
  ['🍅', '番茄', '果實', '番茄是果實，裡面有種子。'],
  ['🥔', '馬鈴薯', '莖', '馬鈴薯有芽眼，是莖。'],
  ['🥬', '高麗菜', '葉', '高麗菜是一片一片的葉子。'],
  ['🥜', '花生', '種子', '花生仁是種子。'],
  ['🍠', '地瓜', '根', '地瓜是根。'],
  ['🍉', '西瓜', '果實', '西瓜是果實，黑黑的是種子。']
];
var fi = 0, fdone = false, right = 0;
function showFood() {
  var f = FOODS[fi], q = $('qf');
  q.textContent = f[0]; q.className = 'qfood'; void q.offsetWidth; q.className = 'qfood pop';
  $('qn').textContent = f[1]; $('msg').textContent = ''; fdone = false;
  [].forEach.call(document.querySelectorAll('#six button'), function (b) { b.className = ''; });
  $('score').textContent = '第 ' + (fi + 1) + ' / ' + FOODS.length + ' 個';
}
$('six').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || fdone) return;
  var f = FOODS[fi];
  if (b.textContent === f[2]) { fdone = true; b.className = 'right'; $('msg').style.color = '#0e6b2e'; $('msg').textContent = '🎉 ' + f[3]; say('答對了！' + f[3]); }
  else { b.className = 'wrong'; $('msg').style.color = '#a0161b'; $('msg').textContent = '再想想看！'; say('再想想看'); }
});
$('nextF').onclick = function () { fi = (fi + 1) % FOODS.length; showFood(); };
showFood();
window.onStep = function (i) {
  clearT();
  if (i === 0) dropFood();
};

</script>
<nav class="nav"><button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button></nav>
<script>
/* ===== 共用程式（不要改） ===== */
function pickVoice(lang, want) {
  var BAD = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|fred|good news|hysterical|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|eloquence/i;
  var GOOD = ['samantha', 'ava', 'allison', 'susan', 'zoe', 'nicky', 'joelle', 'evan', 'nathan', 'tom', 'aaron', 'google us english', 'microsoft aria', 'microsoft jenny', 'microsoft guy'];
  var all = speechSynthesis.getVoices(), best = null, bestScore = -1;
  for (var i = 0; i < all.length; i++) {
    var v = all[i], l = v.lang.replace('_', '-').toLowerCase();
    if (l.indexOf(lang.toLowerCase().slice(0, 2)) !== 0) continue;
    if (want && v.name === want) return v;
    if (BAD.test(v.name)) continue;
    var n = v.name.toLowerCase(), sc = l.indexOf(lang.toLowerCase()) === 0 ? 5 : 0;
    if (/premium/.test(n)) sc += 30;
    if (/enhanced|neural|natural/.test(n)) sc += 20;
    for (var g = 0; g < GOOD.length; g++) if (n.indexOf(GOOD[g]) >= 0) { sc += 15 - g * 0.5; break; }
    if (sc > bestScore) { best = v; bestScore = sc; }
  }
  return best;
}
function say(t, lang, rate) {
  try {
    speechSynthesis.cancel();
    var P = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) P[p[0]] = decodeURIComponent(p[1] || ''); });
    var u = new SpeechSynthesisUtterance(t);
    u.lang = lang || 'zh-TW';
    var en = u.lang.indexOf('en') === 0;
    u.rate = rate || (en ? (parseFloat(P.rate) || 0.75) : 0.9);
    var v = pickVoice(u.lang, en ? P.voice : '');
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
var steps = [].slice.call(document.querySelectorAll('.step')), cur = 0, prog = document.querySelector('.prog');
steps.forEach(function () { prog.appendChild(document.createElement('i')); });
function go(n) {
  cur = Math.max(0, Math.min(steps.length - 1, n));
  steps.forEach(function (s, i) { s.classList.toggle('on', i === cur); });
  [].forEach.call(prog.children, function (d, i) { d.classList.toggle('on', i <= cur); });
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = cur === steps.length - 1 ? '🎉 學完了' : '下一步 ▶';
  window.scrollTo(0, 0);
  var s = steps[cur];
  if (s.dataset.auto) say(s.dataset.auto, s.dataset.lang);
  if (window.onStep) window.onStep(cur, s);
}
document.getElementById('prev').onclick = function () { go(cur - 1); };
document.getElementById('next').onclick = function () {
  if (cur < steps.length - 1) return go(cur + 1);
  document.querySelector('.wrap').innerHTML = '<h1 style="margin-top:40px">🎉 學完了！</h1><p class="big">Ivan勇士好棒！<br>按左上角的 ✕ 回到今日任務。</p><p class="center" style="font-size:90px">🏆</p>';
  document.querySelector('.nav').remove();
  say('學完了！Ivan勇士好棒！');
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) say(b.dataset.say, b.dataset.lang); });
[].forEach.call(document.querySelectorAll('.quiz'), function (q) {
  q.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || q.dataset.done) return;
    var fb = q.parentNode.querySelector('.fb'), ok = b.hasAttribute('data-right');
    b.classList.add(ok ? 'right' : 'wrong');
    if (ok) { q.dataset.done = 1; fb.style.color = '#0e6b2e'; fb.textContent = '🎉 答對了！' + (q.dataset.why || ''); say('答對了！' + (q.dataset.why || '')); }
    else { fb.style.color = '#a0161b'; fb.textContent = '再想想看！'; say('再想想看'); }
  });
});
go(0);
</script>
</body>
