<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Holidays!</title>
<style>
:root { --c: #3f6fe0; --ink: #2b2112; --bg: #fffaf0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
.prog { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.prog i { width: 14px; height: 14px; border-radius: 50%; background: #e0d6c3; }
.prog i.on { background: var(--c); }
.step { display: none; }
.step.on { display: block; animation: stepIn .45s ease-out; }
@keyframes stepIn { from { opacity: 0; transform: translateY(18px); } }
h1 { margin: 6px 0 10px; font-size: clamp(26px, 6.5vw, 38px); text-align: center; color: var(--c); }
.big { font-size: clamp(21px, 5.4vw, 29px); font-weight: 900; line-height: 1.55; text-align: center; margin: 8px 0; }
.small { font-size: 17px; font-weight: 700; text-align: center; color: #6a5536; }
.stage { position: relative; min-height: 240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; padding: 16px; border-radius: 24px; background: #fff; box-shadow: 0 5px 0 #eadfc8; overflow: hidden; }
.say { display: inline-flex; align-items: center; gap: 6px; margin: 6px; padding: 10px 18px; border: 0; border-radius: 999px; background: #e3f2fd; box-shadow: 0 3px 0 #90caf9; font: inherit; font-size: 18px; font-weight: 900; color: #0d47a1; cursor: pointer; }
.say:active { transform: translateY(2px); }
.center { text-align: center; }
.card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; padding: 12px 14px; border: 0; border-radius: 20px; background: #fff7ec; box-shadow: 0 4px 0 #f0d9b5; font: inherit; cursor: pointer; }
.card:active { transform: translateY(3px); }
.quiz { display: grid; gap: 10px; margin-top: 12px; }
.quiz button { min-height: 60px; padding: 8px 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 #d6c39a; font: inherit; font-size: clamp(19px, 5vw, 24px); font-weight: 900; color: var(--ink); cursor: pointer; }
.quiz button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.quiz button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.fb { min-height: 1.6em; margin-top: 10px; text-align: center; font-size: 20px; font-weight: 900; color: #0e6b2e; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,250,240,.96); box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
.nav button { flex: 1; min-height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
#prev { background: #fff; box-shadow: 0 4px 0 #d7c3ad; color: var(--ink); }
#next { background: linear-gradient(180deg, #ffe38a, #ffc93c 55%, #e09a12); box-shadow: 0 4px 0 #9a6608; color: #3a2208; }
.nav button:disabled { opacity: .4; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
/* ===== 自訂樣式 ===== */
.sky { position: relative; width: 100%; height: 220px; border-radius: 18px; background: linear-gradient(#1d2b64, #3f6fe0); overflow: hidden; }
.spark { position: absolute; width: 8px; height: 8px; border-radius: 50%; opacity: 0; }
.spark.go { animation: boom 1.4s ease-out forwards; }
@keyframes boom { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); } }
.hol { position: absolute; bottom: 14px; font-size: 52px; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-14px); } }
.en { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.hcards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
.hcards .card { min-width: 0; }
.hcards .card span { font-size: 50px; }
.hcards .card b { font-size: 20px; color: #2a4fb0; }
.hcards .card small { font-size: 17px; font-weight: 800; color: #6a5536; }
.hcards .card em { font-style: normal; font-size: 17px; font-weight: 900; color: #fff; background: #3f6fe0; border-radius: 999px; padding: 2px 10px; visibility: hidden; }
.hcards .card.open em { visibility: visible; animation: grow .4s ease-out; }
@keyframes grow { from { transform: scale(0); } }
.thing { font-size: 96px; line-height: 1.1; }
.thing.pop { animation: grow .4s ease-out; }
.tname { font-size: 24px; font-weight: 900; color: #2a4fb0; }
.pick4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }
.pick4 button { min-height: 60px; border: 0; border-radius: 18px; background: #eef3ff; box-shadow: 0 4px 0 #a9bdf2; font: inherit; font-size: 19px; font-weight: 900; color: #23408f; cursor: pointer; }
.pick4 button.right { background: #d8f7e1; box-shadow: 0 4px 0 #2fb35a; color: #0e6b2e; }
.pick4 button.wrong { background: #ffe1e1; box-shadow: 0 4px 0 #e5484d; color: #a0161b; }
.msg { min-height: 1.6em; font-size: 20px; font-weight: 900; text-align: center; margin-top: 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tabs button { min-height: 52px; padding: 6px 14px; border: 0; border-radius: 999px; background: #eef3ff; box-shadow: 0 3px 0 #a9bdf2; font: inherit; font-size: 18px; font-weight: 900; color: #23408f; cursor: pointer; }
.tabs button.on { background: #3f6fe0; color: #fff; box-shadow: 0 3px 0 #23408f; }
.sent { width: 100%; padding: 14px; border-radius: 18px; background: #f4f7ff; text-align: center; }
.sent .q { font-size: 19px; font-weight: 800; color: #6a5536; }
.sent .a { font-size: clamp(22px, 5.6vw, 30px); font-weight: 900; color: #23408f; margin: 6px 0; }
.sent .a u { text-decoration: none; color: #c0392b; background: #ffe9b3; border-radius: 6px; padding: 0 4px; }
.sent .zh { font-size: 18px; font-weight: 800; color: #6a5536; }
</style>
</head>
<body>
<main class="wrap">
  <div class="prog"></div>
  <section class="step" data-auto="Holidays! Let's learn about holidays." data-lang="en-US">
    <h1 class="en">🎉 Happy Holidays!</h1>
    <div class="stage" style="padding:8px">
      <div class="sky" id="sky">
        <span class="hol" style="left:6%">🧧</span>
        <span class="hol" style="left:30%;animation-delay:.3s">🥮</span>
        <span class="hol" style="left:54%;animation-delay:.6s">🎃</span>
        <span class="hol" style="left:78%;animation-delay:.9s">🎄</span>
      </div>
    </div>
    <p class="big"><span class="en">holiday</span> = 節日</p>
    <p class="center"><button class="say" data-say="holiday. holidays." data-lang="en-US">🔊 holiday</button></p>
  </section>

  <section class="step" data-auto="Four holidays. Tap and listen." data-lang="en-US">
    <h1>🗓️ 四個節日</h1>
    <div class="stage">
      <div class="hcards">
        <button class="card" data-say="Chinese New Year. It is in January or February." data-lang="en-US"><span>🧧</span><b class="en">Chinese New Year</b><small>過年</small><em>Jan / Feb</em></button>
        <button class="card" data-say="the Moon Festival. It is in September or October." data-lang="en-US"><span>🥮</span><b class="en">Moon Festival</b><small>中秋節</small><em>Sep / Oct</em></button>
        <button class="card" data-say="Halloween. It is on October thirty-first." data-lang="en-US"><span>🎃</span><b class="en">Halloween</b><small>萬聖節</small><em>Oct 31</em></button>
        <button class="card" data-say="Christmas. It is on December twenty-fifth." data-lang="en-US"><span>🎄</span><b class="en">Christmas</b><small>聖誕節</small><em>Dec 25</em></button>
      </div>
    </div>
    <p class="small">點卡片，聽聽節日的英文和它在幾月 📅</p>
  </section>

  <section class="step" data-auto="Which holiday is it? Look and tap." data-lang="en-US">
    <h1>🔍 是哪個節日？</h1>
    <div class="stage" style="flex-direction:column">
      <div class="thing" id="thing">🧧</div>
      <button class="say en" id="tname" data-lang="en-US">🔊 red envelopes</button>
      <div class="pick4" id="pick4">
        <button class="en" data-h="cny">🧧 Chinese New Year</button>
        <button class="en" data-h="moon">🥮 Moon Festival</button>
        <button class="en" data-h="hw">🎃 Halloween</button>
        <button class="en" data-h="xmas">🎄 Christmas</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
    <p class="center"><button class="say" id="nextThing">➡️ 下一個</button></p>
  </section>

  <section class="step" data-auto="Answer in a full sentence. Tap a holiday and listen." data-lang="en-US">
    <h1>🗣️ 用完整句子說</h1>
    <div class="tabs" id="tabs">
      <button class="on" data-i="0">⭐ 最喜歡</button>
      <button data-i="1">🧧 過年</button>
      <button data-i="2">🥮 中秋節</button>
      <button data-i="3">🎄 聖誕節</button>
    </div>
    <div class="stage">
      <div class="sent">
        <div class="q en" id="sq"></div>
        <div class="a en" id="sa"></div>
        <div class="zh" id="sz"></div>
        <button class="say" id="sayA">🔊 聽句子</button>
      </div>
    </div>
    <p class="small">注意小字：<span class="en">on</span> Chinese New Year、<span class="en">at</span> the Moon Festival、<span class="en">for</span> Christmas</p>
  </section>

  <section class="step" data-auto="Quiz time! What holiday is this?" data-lang="en-US">
    <h1>✏️ 小測驗 1</h1>
    <p class="big"><span style="font-size:70px">🎃</span><br><span class="en">What holiday is this?</span></p>
    <div class="quiz en" data-why="南瓜燈🎃是萬聖節 Halloween，在十月三十一日。">
      <button>Christmas</button>
      <button data-right>Halloween</button>
      <button>Chinese New Year</button>
    </div>
    <div class="fb"></div>
  </section>

  <section class="step" data-auto="When is Christmas?" data-lang="en-US">
    <h1>✏️ 小測驗 2</h1>
    <p class="big"><span style="font-size:70px">🎄</span><br><span class="en">When is Christmas?</span></p>
    <div class="quiz en" data-why="聖誕節 Christmas 在十二月二十五日，December 25th。">
      <button>October 31st</button>
      <button data-right>December 25th</button>
      <button>January 1st</button>
    </div>
    <div class="fb"></div>
  </section>

  <section class="step" data-auto="What do you get on Chinese New Year?" data-lang="en-US">
    <h1>✏️ 小測驗 3</h1>
    <p class="big"><span class="en">What do you get on<br>Chinese New Year?</span></p>
    <div class="quiz en" data-why="過年會拿到紅包，紅包的英文是 red envelopes。">
      <button data-right>I get red envelopes.</button>
      <button>I get mooncakes.</button>
      <button>I get a pumpkin.</button>
    </div>
    <div class="fb"></div>
  </section>
</main>
<script>
/* 煙火 */
var sky = document.getElementById('sky'), fwT = null;
function firework() {
  var x = 15 + Math.random() * 70, y = 15 + Math.random() * 35, cols = ['#ffd54f', '#ff8a80', '#80d8ff', '#b9f6ca', '#ea80fc'];
  var c = cols[Math.floor(Math.random() * cols.length)];
  for (var i = 0; i < 12; i++) {
    var s = document.createElement('i'); s.className = 'spark';
    var a = i / 12 * Math.PI * 2;
    s.style.left = x + '%'; s.style.top = y + '%'; s.style.background = c;
    s.style.setProperty('--dx', Math.cos(a) * 60 + 'px'); s.style.setProperty('--dy', Math.sin(a) * 60 + 'px');
    sky.appendChild(s); s.classList.add('go');
    (function (el) { setTimeout(function () { el.remove(); }, 1500); })(s);
  }
}
/* 卡片 */
[].forEach.call(document.querySelectorAll('.hcards .card'), function (c) { c.addEventListener('click', function () { c.classList.add('open'); }); });
/* 是哪個節日 */
var THINGS = [
  ['🧧', 'red envelopes', 'cny', '紅包'],
  ['🥮', 'mooncakes', 'moon', '月餅'],
  ['🎃', 'a jack-o\'-lantern', 'hw', '南瓜燈'],
  ['🎁', 'presents', 'xmas', '禮物'],
  ['🍈', 'pomelos', 'moon', '柚子'],
  ['🍬', 'candy, trick or treat', 'hw', '糖果'],
  ['🎅', 'Santa Claus', 'xmas', '聖誕老公公']
];
var NAMES = { cny: 'Chinese New Year', moon: 'the Moon Festival', hw: 'Halloween', xmas: 'Christmas' };
var ti = 0, done = false;
function showThing() {
  var t = THINGS[ti], th = document.getElementById('thing'), tn = document.getElementById('tname');
  th.textContent = t[0]; th.className = 'thing'; void th.offsetWidth; th.className = 'thing pop';
  tn.textContent = '🔊 ' + t[1]; tn.dataset.say = t[1];
  done = false; document.getElementById('msg').textContent = '';
  [].forEach.call(document.querySelectorAll('#pick4 button'), function (b) { b.className = 'en'; });
}
document.getElementById('pick4').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || done) return;
  var t = THINGS[ti], m = document.getElementById('msg');
  if (b.dataset.h === t[2]) {
    done = true; b.className = 'en right'; m.style.color = '#0e6b2e';
    m.textContent = '🎉 ' + t[3] + ' → ' + NAMES[t[2]];
    say(t[1] + '. ' + NAMES[t[2]] + '!', 'en-US');
  } else { b.className = 'en wrong'; m.style.color = '#a0161b'; m.textContent = '再想想看！'; say('再想想看'); }
});
document.getElementById('nextThing').onclick = function () { ti = (ti + 1) % THINGS.length; showThing(); };
/* 句子 */
var SENT = [
  ['What holiday do you like best?', 'I like <u>Christmas</u> best.', 'I like Christmas best.', '我最喜歡聖誕節。'],
  ['What do you get on Chinese New Year?', 'I get red envelopes <u>on</u> Chinese New Year.', 'I get red envelopes on Chinese New Year.', '我過年會拿到紅包。'],
  ['What do you eat at the Moon Festival?', 'I eat mooncakes <u>at</u> the Moon Festival.', 'I eat mooncakes at the Moon Festival.', '我中秋節吃月餅。'],
  ['What do you want for Christmas?', 'I want a toy car <u>for</u> Christmas.', 'I want a toy car for Christmas.', '我聖誕節想要一臺玩具車。']
];
var si = 0;
function showSent(speak) {
  var s = SENT[si];
  document.getElementById('sq').textContent = s[0];
  document.getElementById('sa').innerHTML = s[1];
  document.getElementById('sz').textContent = s[3];
  [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', +b.dataset.i === si); });
  if (speak) say(s[0] + ' ' + s[2], 'en-US');
}
document.getElementById('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; si = +b.dataset.i; showSent(true); });
document.getElementById('sayA').onclick = function () { say(SENT[si][2], 'en-US'); };
showThing(); showSent(false);
window.onStep = function (i) {
  clearInterval(fwT);
  if (i === 0) { firework(); fwT = setInterval(firework, 900); }
};

</script>
<nav class="nav"><button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button></nav>
<script>
/* ===== 共用程式（不要改） ===== */
function pickVoice(lang, want) {
  var BAD = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|fred|good news|hysterical|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|eloquence/i;
  var GOOD = ['samantha', 'ava', 'allison', 'susan', 'zoe', 'nicky', 'joelle', 'evan', 'nathan', 'tom', 'aaron', 'google us english', 'microsoft aria', 'microsoft jenny', 'microsoft guy'];
  var all = speechSynthesis.getVoices(), best = null, bestScore = -1;
  for (var i = 0; i < all.length; i++) {
    var v = all[i], l = v.lang.replace('_', '-').toLowerCase();
    if (l.indexOf(lang.toLowerCase().slice(0, 2)) !== 0) continue;
    if (want && v.name === want) return v;
    if (BAD.test(v.name)) continue;
    var n = v.name.toLowerCase(), sc = l.indexOf(lang.toLowerCase()) === 0 ? 5 : 0;
    if (/premium/.test(n)) sc += 30;
    if (/enhanced|neural|natural/.test(n)) sc += 20;
    for (var g = 0; g < GOOD.length; g++) if (n.indexOf(GOOD[g]) >= 0) { sc += 15 - g * 0.5; break; }
    if (sc > bestScore) { best = v; bestScore = sc; }
  }
  return best;
}
function say(t, lang, rate) {
  try {
    speechSynthesis.cancel();
    var P = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) P[p[0]] = decodeURIComponent(p[1] || ''); });
    var u = new SpeechSynthesisUtterance(t);
    u.lang = lang || 'zh-TW';
    var en = u.lang.indexOf('en') === 0;
    u.rate = rate || (en ? (parseFloat(P.rate) || 0.75) : 0.9);
    var v = pickVoice(u.lang, en ? P.voice : '');
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
var steps = [].slice.call(document.querySelectorAll('.step')), cur = 0, prog = document.querySelector('.prog');
steps.forEach(function () { prog.appendChild(document.createElement('i')); });
function go(n) {
  cur = Math.max(0, Math.min(steps.length - 1, n));
  steps.forEach(function (s, i) { s.classList.toggle('on', i === cur); });
  [].forEach.call(prog.children, function (d, i) { d.classList.toggle('on', i <= cur); });
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = cur === steps.length - 1 ? '🎉 學完了' : '下一步 ▶';
  window.scrollTo(0, 0);
  var s = steps[cur];
  if (s.dataset.auto) say(s.dataset.auto, s.dataset.lang);
  if (window.onStep) window.onStep(cur, s);
}
document.getElementById('prev').onclick = function () { go(cur - 1); };
document.getElementById('next').onclick = function () {
  if (cur < steps.length - 1) return go(cur + 1);
  document.querySelector('.wrap').innerHTML = '<h1 style="margin-top:40px">🎉 學完了！</h1><p class="big">Ivan勇士好棒！<br>按左上角的 ✕ 回到今日任務。</p><p class="center" style="font-size:90px">🏆</p>';
  document.querySelector('.nav').remove();
  say('學完了！Ivan勇士好棒！');
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) say(b.dataset.say, b.dataset.lang); });
[].forEach.call(document.querySelectorAll('.quiz'), function (q) {
  q.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || q.dataset.done) return;
    var fb = q.parentNode.querySelector('.fb'), ok = b.hasAttribute('data-right');
    b.classList.add(ok ? 'right' : 'wrong');
    if (ok) { q.dataset.done = 1; fb.style.color = '#0e6b2e'; fb.textContent = '🎉 答對了！' + (q.dataset.why || ''); say('答對了！' + (q.dataset.why || '')); }
    else { fb.style.color = '#a0161b'; fb.textContent = '再想想看！'; say('再想想看'); }
  });
});
go(0);
</script>
</body>
</html>
